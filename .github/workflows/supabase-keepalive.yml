name: Supabase keep-alive

# Les projets Supabase du plan gratuit sont mis en pause apres 7 jours
# de FAIBLE activite sur la base (pas seulement zero activite).
# La doc parle de "a few user requests to the database each day" :
# 1 requete/jour ne suffisait pas -> mail d'avertissement recu le 06/09/2026
# alors que ce job tournait au vert. On passe a 4 passages/jour x 3 requetes.

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:          # declenchement manuel possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: "https://cyczhlsugdbguahbfbuz.supabase.co"
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5Y3pobHN1Z2RiZ3VhaGJmYnV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTAzNzgsImV4cCI6MjA5NDE4NjM3OH0.bRNltAnc7QGf2o6B2IwsvOS_KHWUj0ejlvjfrRHIt2M"
        run: |
          sb_get() {
            curl -s -o /dev/null -w "%{http_code}" \
              "${SB_URL}/rest/v1/$1" \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}"
          }
          fail=0
          for path in \
            "training_logs?select=store_key&limit=1" \
            "training_logs?select=store_key,updated_at&order=updated_at.desc&limit=5" \
            "training_logs?select=store_key&store_key=eq.prog_logs_v5"
          do
            code=$(sb_get "${path}")
            echo "HTTP ${code}  <-  ${path}"
            [ "${code}" = "200" ] || fail=1
            sleep 5
          done
          exit "${fail}"

name: Supabase keep-alive

# Les projets Supabase du plan gratuit sont mis en pause apres 7 jours
# de faible activite sur la base. Ce job envoie une requete REST par jour
# pour maintenir le projet actif.

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours a 06:17 UTC
  workflow_dispatch:        # declenchement manuel possible

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SB_URL: "https://cyczhlsugdbguahbfbuz.supabase.co"
          SB_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5Y3pobHN1Z2RiZ3VhaGJmYnV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTAzNzgsImV4cCI6MjA5NDE4NjM3OH0.bRNltAnc7QGf2o6B2IwsvOS_KHWUj0ejlvjfrRHIt2M"
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SB_URL}/rest/v1/training_logs?select=store_key&limit=1" \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}")
          echo "HTTP ${code}"
          test "${code}" = "200"

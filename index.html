<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bloc 6 — Format hebdomadaire</title>
<style>
:root{
  --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#28303f;
  --txt:#e8edf5; --dim:#8b97ab; --acc:#ff6b35; --acc2:#4ade80; --blue:#38bdf8; --warn:#fbbf24; --purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.4px;font-weight:700}
h1 span{color:var(--acc)}
.sync{font-size:11px;color:var(--dim);white-space:nowrap}
.sync.ok{color:var(--acc2)} .sync.err{color:var(--warn)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#0b0e14}
main{padding:14px 14px 90px}
.weeknote{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:11px 13px;border-radius:10px;font-size:13px;color:var(--dim);margin-bottom:14px}
.weeknote b{color:var(--txt)}
.prog-bar{display:flex;gap:3px;margin:10px 0 14px}
.pdot{flex:1;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.pdot.ok{background:var(--acc2);border-color:var(--acc2)}
.pdot.cur{background:var(--acc);border-color:var(--acc)}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sess.isdone{opacity:.75;border-color:#4ade8033}
.sess.iscur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.shead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.sid{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;
  font-weight:800;padding:4px 8px;color:var(--acc);flex:0 0 auto}
.sess.isdone .sid{color:var(--acc2)}
.stitle{flex:1;min-width:0}
.stitle b{display:block;font-size:14px;font-weight:700}
.stitle small{color:var(--dim);font-size:11.5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;flex:0 0 auto}
.tag.MUSCU{background:#ff6b3522;color:var(--acc)}
.tag.HALTERO{background:#fbbf2422;color:var(--warn)}
.tag.PDC{background:#4ade8022;color:var(--acc2)}
.tag.TEST{background:#38bdf822;color:var(--blue)}
.tag.WOD{background:#a78bfa22;color:var(--purple)}
.tag.FORCE{background:#ff6b3522;color:var(--acc)}
.tag.CARDIO{background:#38bdf822;color:var(--blue)}
.chev{color:var(--dim);font-size:12px;flex:0 0 auto}
.sbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.sess.open .sbody{display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px}
.focus{font-size:12.5px;color:var(--dim);margin:12px 0;padding:10px;background:var(--panel2);
  border-radius:9px;border-left:3px solid var(--blue)}
.focus b{color:var(--txt)}
.verb{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc2);
  border-radius:9px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.55}
.verb div{margin-bottom:3px}
.verb b{color:var(--txt)} .verb u{color:var(--blue);text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.4px}
.src{font-size:10.5px;color:var(--dim);letter-spacing:.3px;margin-top:6px;font-style:italic}
.bt{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--acc);margin:16px 0 8px;text-transform:uppercase}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.ex.done{border-color:#4ade8055;background:#4ade800d}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh b{flex:1;font-size:13.5px;font-weight:700}
.presc{font-size:12px;color:var(--dim);margin:3px 0 8px}
.target{font-size:11px;color:var(--blue);margin-bottom:8px}
.hist{font-size:11.5px;color:var(--purple);background:#a78bfa14;border:1px solid #a78bfa33;
  border-radius:8px;padding:6px 9px;margin-bottom:8px}
.hist b{color:#c4b5fd}
.grid{display:grid;gap:5px;margin-bottom:8px;overflow-x:auto}
.glabel{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.grid input{background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px 3px;text-align:center;font-size:15px;font-weight:600;
  font-family:inherit;width:100%;min-width:0}
.grid input:focus{outline:none;border-color:var(--acc)}
.grid input.wgt{border-color:#fbbf2444;color:var(--warn)}
.score input{width:100%;background:var(--bg);border:1px solid var(--acc);color:var(--txt);
  border-radius:9px;padding:11px;font-size:16px;font-weight:700;font-family:inherit;text-align:center}
.note{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:34px}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.up{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
.up.on{background:var(--acc2);border-color:var(--acc2);color:#0b0e14}
.rpe{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
.finish{width:100%;margin-top:16px;padding:14px;border-radius:11px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--acc2);border:1px solid var(--acc2);color:#0b0e14}
.finish.re{background:var(--panel2);border-color:var(--line);color:var(--dim)}
.finish.pdc{background:var(--blue);border-color:var(--blue)}
.attempts{background:#38bdf80d;border:1px solid #38bdf833;border-radius:9px;padding:9px 11px;margin:12px 0;font-size:12px;color:var(--dim)}
.attempts b{color:var(--blue)}
.attempts div{margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(11,14,20,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button.p{background:var(--acc);border-color:var(--acc);color:#0b0e14}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:760px;margin:30px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.mbox h3{margin:0 0 12px;font-size:15px}
.mbox textarea{width:100%;height:52vh;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;resize:vertical}
.prog table{width:100%;border-collapse:collapse;font-size:13px}
.prog th,.prog td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.prog th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.prog td.d{font-weight:700}
.prog td.d.pos{color:var(--acc2)} .prog td.d.neg{color:#f87171}
.pill{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin:0 6px 5px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>BLOC 6 — <span>4 SEMAINES</span></h1>
    <div class="sync" id="sync">…</div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="bar">
  <button onclick="showProg()">📈 Progression</button>
  <button onclick="doExport()">💾 Export</button>
  <button class="p" onclick="showResume()">🤖 Résumé</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <div id="mcontent"></div>
    <div class="row2" style="margin-top:12px">
      <button class="up" style="flex:1;padding:11px" onclick="copyBox()">📋 Copier</button>
      <button class="up" style="flex:1;padding:11px" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   BLOC 6 — FORMAT HEBDOMADAIRE FIXE (4 semaines · 5 séances/semaine)
   Lundi MUSCU B · Mardi HALTÉRO A · Mercredi MUSCU C · Jeudi HALTÉRO B · Vendredi MUSCU A
   Weekend : foot/boxe libre + WOD poids de corps à la guise (onglet dédié).
   Même structure d'exercices toutes les semaines — seules les charges montent.
   Salle CrossFit sans machines. Charges en LIVRES (lb).
   ========================================================================= */

const PROGRAM = {
  store: "prog_logs_v8",
  bloc: "BLOC 6 — FORMAT HEBDOMADAIRE FIXE (4 semaines)",
  sessions: [

  /* ======================================================= SEMAINE 1 */
  {
    id:"S1B", day:"SEMAINE 1 · LUNDI", name:"MUSCU B — Chaîne postérieure & dos · Semaine 1", tag:"MUSCU", dur:"65-70 min",
    focus:"<b>Nouveau format hebdo : cette séance revient tous les lundis.</b> Reprise sur les charges de ta dernière séance chaîne postérieure (245 lb au DT, 135 au hip thrust) : +10 lb bas du corps, +5 lb haut du corps, comme d'habitude.",
    blocks:[
      { title:"FORCE", items:[
        { id:"dl", ex:"deadlift", name:"Soulevé de terre", presc:"5 séries de 3 — repos 3'", sets:5, unit:"reps", w:1,
          target:"255 lb. Tu as fini à 245 × 3,3,3,3,5 — dos verrouillé, on ne cherche pas le max." },
        { id:"ht", ex:"hip_thrust", name:"Hip thrust barre", presc:"4 séries de 10 — repos 90''", sets:4, unit:"reps", w:1,
          target:"145 lb. 1'' de contraction en haut, menton rentré." },
        { id:"gm", ex:"good_morning", name:"Good morning", presc:"3 séries de 12 — repos 90'' — charge légère", sets:3, unit:"reps", w:1,
          target:"70 lb. « Monte très peu » noté à chaque fois — incrément réduit volontairement, le dos doit rester plat du début à la fin." }
      ]},
      { title:"DOS", items:[
        { id:"rowb", ex:"row_barre", name:"Rowing barre penché", presc:"4 séries de 8 — repos 90''", sets:4, unit:"reps", w:1,
          target:"140 lb, comme la dernière fois (3e série cassée à 7 — stabilise avant de monter)." },
        { id:"sup", ex:"trac_sup", name:"Tractions supination", presc:"4 séries de 8 — repos 90''", sets:4, unit:"reps",
          target:"Ajoute 22 lb de lest sur les 4 séries (tu en étais à 10 kg sur 2 séries sur 4)." },
        { id:"shrug", ex:"shrug", name:"Shrugs barre", presc:"3 séries de 15 — repos 60''", sets:3, unit:"reps", w:1,
          target:"130 lb. Tu étais parti trop lourd à 140 (série à 11 reps) — on repart un cran en dessous." }
      ]},
      { title:"BRAS & FINISHER", items:[
        { id:"curl", ex:"curl_barre", name:"Curl barre", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1,
          target:"65 lb (tu redescendais toi-même vers 62-67 la dernière fois)." },
        { id:"farm", ex:"farmer", name:"Farmer walk", presc:"4 × 40 m — repos 90''", sets:4, unit:"m", w:1,
          target:"66 lb par main sur les 4 séries (tu as fini en pyramide jusqu'à 61,6 lb)." }
      ]}
    ]
  },

  {
    id:"S1HA", day:"SEMAINE 1 · MARDI", name:"HALTÉRO A — Clean & Jerk + Grace · Semaine 1", tag:"HALTERO", dur:"60-65 min",
    focus:"<b>Technique d'abord, WOD ensuite, muscle à la fin.</b> Grace se refait chaque semaine <b>à charge identique (95 lb)</b> : c'est ton chrono de référence sur les 4 semaines — dernier temps connu : 4'39.",
    blocks:[
      { title:"TECHNIQUE", items:[
        { id:"pc", ex:"power_clean", name:"Power clean", presc:"5 séries de 3 — repos 2'", sets:5, unit:"reps", w:1,
          target:"140 lb. Vitesse sous la barre, pas la charge." },
        { id:"jerk", ex:"split_jerk", name:"Split jerk", presc:"5 séries de 2 — repos 2'", sets:5, unit:"reps", w:1,
          target:"140 lb. Fente franche, bras verrouillés avant de recevoir." }
      ]},
      { title:"MONTÉE EN CHARGE", items:[
        { id:"cj", ex:"cj_max", name:"Clean & Jerk — 5 singles montants", presc:"1 rep par série, on monte à chaque série", sets:5, unit:"reps", w:1,
          target:"Échelle indicative : 140/145/150/155/160. Dernière série = lourd du jour, pas un max." }
      ]},
      { title:"WOD — GRACE", wod:true, items:[
        { id:"wod", ex:"wod_grace", name:"30 Clean & Jerk @ 95 lb — for time", presc:"Barre au sol à chaque rep. Charge fixe toutes les semaines : c'est ce qui mesure le bloc.", score:"ex : 4'39" }
      ]},
      { title:"FINITION MUSCULAIRE", items:[
        { id:"rowb", ex:"row_barre", name:"Rowing barre penché", presc:"3 séries de 10 — repos 90''", sets:3, unit:"reps", w:1,
          target:"140 lb. Dos plat, barre au nombril." },
        { id:"dip", ex:"dips_force", name:"Dips stricts", presc:"3 séries au maximum de reps — repos 2'", sets:3, unit:"reps",
          target:"Ton point faible historique. Tu es à 25,16,13 — vise mieux sur la 2e et 3e série." }
      ]}
    ]
  },

  {
    id:"S1C", day:"SEMAINE 1 · MERCREDI", name:"MUSCU C — Jambes & tirage · Semaine 1", tag:"MUSCU", dur:"65-70 min",
    focus:"<b>Séance jambes de la semaine.</b> +10 lb sur les mouvements lourds de bas du corps par rapport à ta dernière séance, volume inchangé sur le reste. Espacée de 2 jours de la dernière séance CrossFit jambes (mardi), comme prévu.",
    blocks:[
      { title:"FORCE", items:[
        { id:"bs", ex:"back_squat", name:"Back Squat", presc:"5 séries de 5 — repos 2'30''", sets:5, unit:"reps", w:1,
          target:"160 lb (tu as fini 150 × 5,5,5,5,6)." },
        { id:"bul", ex:"bulgare", name:"Fentes bulgares haltères", presc:"3 séries de 10 par jambe — repos 90''", sets:3, unit:"reps/jbe", w:1,
          target:"32,5 lb par haltère. Pied arrière sur un box." },
        { id:"rdl", ex:"rdl", name:"Soulevé de terre roumain", presc:"3 séries de 10 — repos 90''", sets:3, unit:"reps", w:1,
          target:"155 lb (145 × 10,10,10 passé la dernière fois)." }
      ]},
      { title:"VOLUME JAMBES", items:[
        { id:"fm", ex:"fentes_march", name:"Fentes marchées haltères", presc:"3 séries de 12 pas par jambe — repos 75''", sets:3, unit:"reps/jbe", w:1,
          target:"32,5 lb par haltère. Grand pas, genou arrière proche du sol." },
        { id:"mol", ex:"mollets", name:"Mollets debout (barre ou haltères)", presc:"4 séries de 15 — repos 45''", sets:4, unit:"reps", w:1,
          target:"130 lb. Amplitude complète, 1'' de pause en haut." }
      ]},
      { title:"TIRAGE", items:[
        { id:"tl", ex:"trac_lest", name:"Tractions lestées strictes", presc:"4 séries de 5 — repos 2'", sets:4, unit:"reps", w:1,
          target:"45 lb de lest. 1'' d'arrêt bras tendus en bas." },
        { id:"row", ex:"row_hal", name:"Rowing haltère 1 bras", presc:"3 séries de 12 par bras — repos 75''", sets:3, unit:"reps/bras", w:1,
          target:"49,5 lb par haltère." }
      ]},
      { title:"BRAS & GAINAGE", items:[
        { id:"curl", ex:"curl_mart", name:"Curl marteau haltères", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1,
          target:"27,5 lb — « très très peu » noté deux fois, on ne bouge pas encore, priorité à la forme." },
        { id:"gain", ex:"gain_bt", name:"Gainage bras tendus", presc:"4 × 50'' — repos 30''", sets:4, unit:"sec",
          target:"Note les secondes réellement tenues sans casser." }
      ]}
    ]
  },

  {
    id:"S1HB", day:"SEMAINE 1 · JEUDI", name:"HALTÉRO B — Arraché + Isabel · Semaine 1", tag:"HALTERO", dur:"60-65 min",
    focus:"<b>Mobilité épaules et poignets d'abord.</b> Isabel se refait chaque semaine <b>à charge identique (75 lb)</b> : dernier temps connu 3'25, c'est ta référence sur les 4 semaines.",
    blocks:[
      { title:"MOBILITÉ & FORCE", items:[
        { id:"ohs", ex:"ohs", name:"Overhead squat", presc:"5 séries de 5 — repos 2' — barre à vide puis charge légère", sets:5, unit:"reps", w:1,
          target:"90 lb. Priorité : bras verrouillés, pas la charge — plafond historique 105 lb, poignets sensibles au-delà." },
        { id:"ps", ex:"power_snatch", name:"Power snatch", presc:"6 séries de 2 — repos 2'", sets:6, unit:"reps", w:1,
          target:"90 lb. Cherche le placement avant la charge." }
      ]},
      { title:"MONTÉE EN CHARGE", items:[
        { id:"sn", ex:"snatch_max", name:"Arraché — 5 singles montants", presc:"1 rep par série, on monte à chaque série", sets:5, unit:"reps", w:1,
          target:"Vise 110 lb en dernière série (2 essais manqués à 110 la dernière fois — reste technique avant tout)." }
      ]},
      { title:"WOD — ISABEL", wod:true, items:[
        { id:"wod", ex:"wod_isabel", name:"30 arrachés @ 75 lb — for time", presc:"Power snatch autorisé. Charge fixe toutes les semaines.", score:"ex : 3'25" }
      ]},
      { title:"FINITION MUSCULAIRE", items:[
        { id:"tr", ex:"trac_str", name:"Tractions strictes", presc:"3 séries au maximum de reps — repos 2'", sets:3, unit:"reps",
          target:"Ton point fort (22,10,8 la dernière fois). Sans lest ici." },
        { id:"gain", ex:"gain_bt", name:"Gainage bras tendus", presc:"3 × 55'' — repos 30''", sets:3, unit:"sec" }
      ]}
    ]
  },

  {
    id:"S1A", day:"SEMAINE 1 · VENDREDI", name:"MUSCU A — Poussée haut du corps · Semaine 1", tag:"MUSCU", dur:"65-70 min",
    focus:"<b>Séance poussée de la semaine, en clôture.</b> +5 lb sur les mouvements de force par rapport à ta dernière séance ; le volume d'hypertrophie derrière ne bouge pas.",
    blocks:[
      { title:"FORCE", items:[
        { id:"dc", ex:"bench", name:"Développé couché", presc:"5 séries de 5 — repos 2'30''", sets:5, unit:"reps", w:1,
          target:"180 lb (tu as fini 175 × 5,5,5,5,7)." },
        { id:"dm", ex:"ohp", name:"Développé militaire barre (strict)", presc:"4 séries de 8 — repos 2'", sets:4, unit:"reps", w:1,
          target:"102,5 lb. « Monte mais très peu » — incrément réduit volontairement." },
        { id:"dipl", ex:"dips_lest", name:"Dips lestés", presc:"4 séries de 6 — repos 2'", sets:4, unit:"reps", w:1,
          target:"50 lb de lest." }
      ]},
      { title:"VOLUME — MASSE", items:[
        { id:"dinc", ex:"dev_incl", name:"Développé incliné haltères", presc:"4 séries de 12 — repos 75''", sets:4, unit:"reps", w:1,
          target:"49,5 lb par haltère — reste ici, tu avais noté « peut-être trop lourd »." },
        { id:"ecart", ex:"ecarte", name:"Écartés haltères sur banc", presc:"3 séries de 15 — repos 60''", sets:3, unit:"reps", w:1,
          target:"33 lb. Charge inchangée, amplitude maximale, on étire." },
        { id:"elev", ex:"elev_lat", name:"Élévations latérales", presc:"4 séries de 15 — repos 60''", sets:4, unit:"reps", w:1,
          target:"⚠️ Reste à 16,5 lb — picotements nuque notés à 22 lb, on ne monte pas, on ajoute des reps." },
        { id:"skull", ex:"skull", name:"Barre au front (skull crusher)", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1,
          target:"62 lb (dernière série cassée à 9 — stabilise avant de monter)." },
        { id:"ext", ex:"ext_nuque", name:"Extension nuque haltère", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1,
          target:"55 lb, coudes serrés." }
      ]},
      { title:"GAINAGE", items:[
        { id:"lat", ex:"gain_lat", name:"Gainage latéral", presc:"4 × 45'' par côté — repos 30''", sets:4, unit:"sec/côté" }
      ]}
    ]
  },

  /* ======================================================= SEMAINE 2 */

/* ---------- ÉTAT DES SÉANCES ---------- */
function isDone(s){ return isPdc(s) ? !!meta().pdcDone[s.id] : !!meta().done[s.id]; }
function doneDate(s){ return (isPdc(s) ? meta().pdcDone[s.id] : meta().done[s.id]) || ""; }
function filledCount(s){
  let tot=0, ok=0;
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    tot++;
    const d = DATA[K(s.id,bi,it.id)];
    if(d && (b.wod ? d.score : ((d.reps||[]).some(x=>x!==""&&x!=null) || (d.poids||[]).some(x=>x!==""&&x!=null) || d.note))) ok++;
  }));
  return [ok,tot];
}
function curIndex(){
  for(let i=0;i<N;i++) if(!isDone(SESS[i])) return i;
  return N - 1;
}
function blocFini(){ return SESS.every(isDone); }

function finishSession(id){
  const s = SESS.find(x=>x.id===id); if(!s) return;
  const [ok] = filledCount(s);
  if(ok===0 && !confirm("Aucune perf notée sur cette séance. La marquer quand même comme faite ?")) return;
  meta().done[id] = new Date().toISOString().slice(0,10);
  openId = null; view = "today"; scheduleSave(); render(); window.scrollTo(0,0);
}
function reopenSession(id){
  delete meta().done[id];
  openId = id; scheduleSave(); render(); window.scrollTo(0,0);
}
function finishPdc(id){
  const s = PDC.find(x=>x.id===id); if(!s) return;
  const [ok] = filledCount(s);
  if(ok===0 && !confirm("Aucune perf notée. Marquer quand même comme faite ?")) return;
  meta().pdcDone[id] = new Date().toISOString().slice(0,10);

}

/* Archive la perf courante d'une séance PDC et vide les champs pour un nouvel essai */
function newAttempt(id){
  const s = PDC.find(x=>x.id===id); if(!s) return;
  const txt = perfLine(s);
  if(!txt){ alert("Rien à archiver : aucune perf notée."); return; }
  if(!confirm("Archiver la perf actuelle et repartir sur des champs vides ?")) return;
  const m = meta();
  m.att[id] = m.att[id] || [];
  m.att[id].push({ date: doneDate(s) || new Date().toISOString().slice(0,10), txt: txt });
  s.blocks.forEach((b,bi) => b.items.forEach(it => { delete DATA[K(s.id,bi,it.id)]; }));
  delete m.pdcDone[id];
  scheduleSave(); render(); window.scrollTo(0,0);
}
/* Résumé une ligne des perfs d'une séance (utilisé pour l'archive et l'historique) */
function perfLine(s){
  const parts = [];
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    if(b.wod){ if(d.score) parts.push(it.name + " : " + d.score); return; }
    const r = (d.reps||[]).filter(x=>x!==""&&x!=null);
    const p = (d.poids||[]).filter(x=>x!==""&&x!=null);
    if(!r.length && !p.length) return;
    parts.push(it.name + " " + (p.length ? p.join("/") + " lb " : "") + (r.length ? r.join(", ") + " " + (it.unit||"") : ""));
  }));
  return parts.join(" · ");
}

/* ---------- HISTORIQUE D'UN EXERCICE ---------- */
function prevPerf(exSlug, curIdx){
  if(!exSlug || curIdx==null) return null;
  for(let i=curIdx-1;i>=0;i--){
    const s = SESS[i];
    for(let bi=0;bi<s.blocks.length;bi++){
      for(const it of s.blocks[bi].items){
        if(it.ex !== exSlug) continue;
        const d = DATA[K(s.id,bi,it.id)];
        if(!d) continue;
        const r = (d.reps||[]).filter(x=>x!==""&&x!=null);
        const p = (d.poids||[]).filter(x=>x!==""&&x!=null);
        if(r.length || p.length || d.score) return { sess:s, reps:r, poids:p, score:d.score, unit:it.unit };
      }
    }
  }
  return null;
}
function histLine(it, curIdx){
  const p = prevPerf(it.ex, curIdx);
  if(p){
    let txt = "<b>" + esc(p.sess.day.replace("JOUR ","J")) + "</b> · ";
    if(p.poids.length) txt += "<b>" + esc(p.poids.join(" / ")) + " lb</b> — ";
    if(p.reps.length) txt += esc(p.reps.join(", ")) + " " + esc(p.unit||"");
    else if(p.score) txt += esc(p.score);
    return '<div class="hist">↩︎ Dernière fois : ' + txt + "</div>";
  }
  if(it.ref) return '<div class="hist">↩︎ Référence : ' + esc(it.ref) + "</div>";
  const r = REF_MAP[it.ex];
  if(r && r.h.length) return '<div class="hist">↩︎ Référence <b>' + esc(r.h[0][0]) + "</b> : " + esc(r.h[0][1]) + "</div>";
  return "";
}

/* Meilleure charge notée dans CE bloc pour un exercice */
function bestThisBloc(exSlug){
  let best = null;
  SESS.concat(PDC).forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    if(it.ex !== exSlug) return;
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    (d.poids||[]).forEach(v => {
      const n = parseFloat(String(v).replace(",","."));
      if(isNaN(n)) return;
      if(!best || n > best.v) best = { v:n, sess:s.day.replace("JOUR ","J").replace("PDC ","P") };
    });
  })));
  return best;
}

      + '<div class="stitle"><b>' + esc(s.day) + " — " + esc(s.name) + "</b><small>Fait le " + esc(doneDate(s)) + "</small></div>"
      + '<div class="tag ' + s.tag + '">' + esc(s.tag) + "</div></div>"
      + '<div class="sbody" style="display:block;padding-top:12px">'
      + (body || '<div class="presc">Séance marquée faite, sans perf notée.</div>') + "</div></div>";
  });
  return h;
}

/* ---------- PROGRESSION ---------- */
function wodScore(sid){
  const s = SESS.find(x=>x.id===sid); if(!s) return "";
  for(let bi=0;bi<s.blocks.length;bi++){
    if(!s.blocks[bi].wod) continue;
    const it = s.blocks[bi].items[0];
    const d = DATA[K(sid,bi,it.id)];
    if(d && d.score) return d.score;
  }
  return "";
}
function showProg(){
  const rows = RETESTS.map(t => {
    const a = wodScore(t[0]), b = wodScore(t[1]);
    return "<tr><td>" + esc(t[2]) + "</td><td>" + (a||"—") + "</td><td>" + (b||"—") + '</td><td class="d">'
      + (a && b ? "à comparer" : "—") + "</td></tr>";
  }).join("");

  const best = {};
  SESS.forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    if(!it.w || !it.ex) return;
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    (d.poids||[]).forEach(v => {
      const n = parseFloat(v);
      if(isNaN(n)) return;
      if(!best[it.ex] || n > best[it.ex].v) best[it.ex] = { v:n, name:it.name, sess:s.day.replace("JOUR ","J") };
    });
  })));
  const bestRows = Object.keys(best).map(k =>
    "<tr><td>" + esc(best[k].name) + "</td><td colspan=2><b>" + best[k].v + " lb</b></td><td>" + esc(best[k].sess) + "</td></tr>"
  ).join("");

  let ups = [], pdcScores = [];
  SESS.forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(d && d.up) ups.push(s.day.replace("JOUR ","J") + " · " + it.name);
  })));
  PDC.forEach(s => { const l = perfLine(s); if(l) pdcScores.push(esc(s.name) + " → " + esc(l)); });

  open_("📈 Progression",
    '<div class="prog"><div class="bt">WOD — cycle 1 vs cycle 2 (même charge)</div>'
    + "<table><tr><th>WOD</th><th>1er passage</th><th>Retest</th><th></th></tr>" + rows + "</table>"
    + '<div class="bt">Charges les plus lourdes du bloc</div>'
    + (bestRows ? "<table>" + bestRows + "</table>" : '<div class="presc">Aucune charge notée pour l\'instant.</div>')
    + '<div class="bt">Marqués ↑ (à durcir au Bloc 6)</div>'
    + (ups.length ? ups.map(x => '<span class="pill">' + esc(x) + "</span>").join("") : '<div class="presc">Rien pour l\'instant.</div>')
    + '<div class="bt">Poids de corps</div>'
    + (pdcScores.length ? pdcScores.map(x => '<div class="pill" style="display:block;margin-bottom:5px">' + x + "</div>").join("") : '<div class="presc">Aucune séance poids de corps notée.</div>')
    + "</div>");
}

/* ---------- EXPORT / RÉSUMÉ ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify({ store:STORE, bloc:PROGRAM.bloc, date:new Date().toISOString(), data:DATA }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bloc6-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function sessionResume(s){
  let stxt = "";
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    if(b.wod){
      if(!d.score) return;
      stxt += " • " + it.name + " → " + d.score + (d.up?" ↑":"") + "\n";
    } else {
      const r = (d.reps||[]).filter(x=>x!==""&&x!=null);
      const p = (d.poids||[]).filter(x=>x!==""&&x!=null);
      if(!r.length && !p.length && !d.note) return;
      stxt += " • " + it.name
        + (p.length ? " [" + p.join("/") + " lb]" : "")
        + (r.length ? " → [" + r.join(",") + "] " + it.unit : "")
        + (d.rpe ? " RPE" + d.rpe : "") + (d.up?" ↑":"") + "\n";
    }
    if(d.note) stxt += "   Note : " + d.note + "\n";
  }));
  (meta().att[s.id]||[]).forEach(a => { stxt += " • [essai archivé " + a.date + "] " + a.txt + "\n"; });
  return stxt;
}

function buildResume(){
  let out = "=== MON BILAN — BLOC 6 (FORMAT HEBDOMADAIRE, 4 SEMAINES) ===\n"
    + "Date : " + new Date().toLocaleDateString("fr-FR") + "\n"
    + "Séances salle terminées : " + SESS.filter(isDone).length + "/" + N + "\n";
  SESS.forEach(s => {
    const stxt = sessionResume(s);
    if(stxt || isDone(s))
      out += "\n── " + s.day + " — " + s.name + (isDone(s) ? " (fait le " + doneDate(s) + ")" : " (non terminée)") + " ──\n" + stxt;
  });

  let pdcOut = "";
  PDC.forEach(s => {
    const stxt = sessionResume(s);
    if(stxt || isDone(s))
      pdcOut += "\n── " + s.day + " — " + s.name + (isDone(s) ? " (fait le " + doneDate(s) + ")" : "") + " ──\n" + stxt;
  });
  if(pdcOut) out += "\n\n=== SÉANCES POIDS DE CORPS ===" + pdcOut;

  out += "\n=== DEMANDE ===\nVoici mon bilan Bloc 6. Analyse mes progressions et crée mon Bloc 7 (même format hebdomadaire fixe sur 4 semaines : Lundi B / Mardi Haltéro A / Mercredi C / Jeudi Haltéro B / Vendredi A).\n";
  return out;
}
function showResume(){ open_("🤖 Résumé à coller dans Claude", '<textarea id="box" readonly>' + esc(buildResume()) + "</textarea>"); }
function open_(t, html){
  document.getElementById("mtitle").textContent = t;
  document.getElementById("mcontent").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function copyBox(){
  const b = document.getElementById("box");
  const txt = b ? b.value : document.getElementById("mcontent").innerText;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert("Copié ✓"), ()=>fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Copié ✓"); }catch(e){ alert("Copie manuelle nécessaire"); }
  document.body.removeChild(ta);
}

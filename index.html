<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bloc 3 — Invictus Poids de corps</title>
<style>
:root{
  --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#28303f;
  --txt:#e8edf5; --dim:#8b97ab; --acc:#ff6b35; --acc2:#4ade80; --blue:#38bdf8; --warn:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.4px;font-weight:700}
h1 span{color:var(--acc)}
.sync{font-size:11px;color:var(--dim);white-space:nowrap}
.sync.ok{color:var(--acc2)} .sync.err{color:var(--warn)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#0b0e14}
main{padding:14px 14px 90px}
.weeknote{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:11px 13px;border-radius:10px;font-size:13px;color:var(--dim);margin-bottom:14px}
.weeknote b{color:var(--txt)}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.sid{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;
  font-weight:800;padding:4px 8px;color:var(--acc);flex:0 0 auto}
.stitle{flex:1;min-width:0}
.stitle b{display:block;font-size:14px;font-weight:700}
.stitle small{color:var(--dim);font-size:11.5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;flex:0 0 auto}
.tag.TEST{background:#38bdf822;color:var(--blue)}
.tag.FORCE{background:#ff6b3522;color:var(--acc)}
.tag.WOD{background:#f8717122;color:#f87171}
.tag.CARDIO{background:#4ade8022;color:var(--acc2)}
.tag.PUISSANCE{background:#fbbf2422;color:var(--warn)}
.tag.DECHARGE{background:#8b97ab22;color:var(--dim)}
.chev{color:var(--dim);font-size:12px;flex:0 0 auto}
.sbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.sess.open .sbody{display:block}
.intro{font-size:12.5px;color:var(--dim);margin:12px 0;padding:10px;background:var(--panel2);border-radius:9px}
.verb{font-size:13px;line-height:1.6;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--acc);border-radius:9px;padding:12px;margin-bottom:6px;white-space:normal}
.verb b{color:var(--txt)} .verb u{color:var(--acc);text-decoration:none;font-weight:700;font-size:11.5px;letter-spacing:.4px}
.src{font-size:11px;color:#5f6b7f;margin-top:-6px;margin-bottom:10px;font-style:italic}
.bt{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--acc);margin:16px 0 8px;text-transform:uppercase}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.ex.done{border-color:#4ade8055;background:#4ade800d}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh b{flex:1;font-size:13.5px;font-weight:700}
.presc{font-size:12px;color:var(--dim);margin:3px 0 8px}
.target{font-size:11px;color:var(--blue);margin-bottom:8px}
.reps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.reps input{width:52px;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px 4px;text-align:center;font-size:15px;font-weight:600;font-family:inherit}
.reps input:focus{outline:none;border-color:var(--acc)}
.lest{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;color:var(--dim)}
.lest input{width:80px;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:7px;text-align:center;font-size:14px;font-family:inherit}
.score input{width:100%;background:var(--bg);border:1px solid var(--acc);color:var(--txt);
  border-radius:9px;padding:11px;font-size:16px;font-weight:700;font-family:inherit;text-align:center}
.note{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:34px}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.up{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:700}
.up.on{background:var(--acc2);border-color:var(--acc2);color:#0b0e14}
.rpe{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(11,14,20,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button.p{background:var(--acc);border-color:var(--acc);color:#0b0e14}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:760px;margin:30px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.mbox h3{margin:0 0 12px;font-size:15px}
.mbox textarea{width:100%;height:52vh;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;resize:vertical}
.prog table{width:100%;border-collapse:collapse;font-size:13px}
.prog th,.prog td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.prog th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.prog td.d{font-weight:700}
.prog td.d.pos{color:var(--acc2)} .prog td.d.neg{color:#f87171}
.pill{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin-right:6px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>BLOC 3 — <span>INVICTUS</span></h1>
    <div class="sync" id="sync">…</div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="bar">
  <button onclick="showProg()">📈 Progression</button>
  <button onclick="doExport()">💾 Export</button>
  <button class="p" onclick="showResume()">🤖 Résumé</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <div id="mcontent"></div>
    <div class="row2" style="margin-top:12px">
      <button class="up" style="flex:1;padding:11px" onclick="copyBox()">📋 Copier</button>
      <button class="up" style="flex:1;padding:11px" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
/* BLOC 3 — INVICTUS « Course et poids de corps » (Manuel 6.1)
   14 TRAININGS repris tels quels, 1 jour sur 2 sur 4 semaines. */
const PROGRAM = {

/* ---------- ÉTAT ---------- */
let DATA = {};          // clé -> {reps:[], lest, note, rpe, up, score}
let curWeek = 1;
let saveTimer = null;
let lastCloud = 0;

const K = (s, b, i) => s + "|" + b + "|" + i;
const get = k => (DATA[k] = DATA[k] || { reps: [], lest: "", note: "", rpe: "", up: false, score: "" });
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- RÉSEAU ---------- */
function fetchTimeout(url, opts, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}
function setSync(txt, cls) {
  const e = document.getElementById("sync");
  e.textContent = txt; e.className = "sync " + (cls || "");
}

/* ---------- PERSISTANCE ---------- */
function saveLocal() {
  try { localStorage.setItem(STORE, JSON.stringify(DATA)); } catch (e) {}
}
function scheduleSave() {
  saveLocal();
  setSync("● local", "");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 1200);
}
function pushCloud() {
  setSync("↻ sync…", "");
  fetchTimeout(SUPA_URL + "/rest/v1/training_logs?on_conflict=store_key", {
    method: "POST",
    headers: {
      "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify({ store_key: STORE, data: DATA, updated_at: new Date().toISOString() })
  }, 8000)
    .then(r => { if (!r.ok) throw new Error(r.status); lastCloud = Date.now(); setSync("☁︎ synchronisé", "ok"); })
    .catch(() => setSync("⚠︎ hors ligne (local OK)", "err"));
}
function pullCloud() {
  return fetchTimeout(SUPA_URL + "/rest/v1/training_logs?store_key=eq." + STORE + "&select=data,updated_at", {
    headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY }
  }, 8000)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(rows => {
      if (rows && rows[0] && rows[0].data) {
        const cloud = rows[0].data;
        const localCount = Object.keys(DATA).length;
        const cloudCount = Object.keys(cloud).length;
        // le cloud ne remplace le local que s'il est au moins aussi rempli
        if (cloudCount >= localCount) { DATA = cloud; saveLocal(); render(); }
      }
      setSync("☁︎ synchronisé", "ok");
    })
    .catch(() => setSync("⚠︎ hors ligne (local OK)", "err"));
}

          }
          h += "</div>";
        }
        h += '<textarea class="note" placeholder="Note / ressenti" oninput="setF(\'' + k + "','note',this.value)\">" + esc(d.note) + "</textarea>"

          + '<select class="rpe" onchange="setF(\'' + k + "','rpe',this.value)\">"
          + ["", "6", "7", "8", "9", "10"].map(v => '<option value="' + v + '"' + (String(d.rpe) === v ? " selected" : "") + ">" + (v ? "RPE " + v : "RPE –") + "</option>").join("")
          + "</select></div></div>";
      });
    });
    h += "</div></div>";
  });
  main.innerHTML = h;
}

function doneCount(s) {
  let tot = 0, ok = 0;
  s.blocks.forEach((b, bi) => b.items.forEach(it => {
    tot++;
    const d = DATA[K(s.id, bi, it.id)];
    if (d && (b.wod ? d.score : (d.reps || []).some(x => x !== "" && x != null))) ok++;
  }));
  return ok + "/" + tot + " renseigné" + (ok > 1 ? "s" : "");
}

function toggle(id) {
  const el = document.getElementById("sess_" + id);
  const now = !el.classList.contains("open");
  el.classList.toggle("open", now);
  localStorage.setItem("open_" + id, now ? "1" : "0");
  el.querySelector(".chev").textContent = now ? "▲" : "▼";
}
function setRep(k, i, v) { const d = get(k); d.reps = d.reps || []; d.reps[i] = v; scheduleSave(); markDone(k); }
function setF(k, f, v) { get(k)[f] = v; scheduleSave(); markDone(k); }
function toggleUp(k) { const d = get(k); d.up = !d.up; scheduleSave(); render(); }
function markDone(k) {
  const el = document.getElementById("ex_" + k.replace(/\|/g, "_"));
  if (!el) return;
  const d = DATA[k];
  const f = d && (d.score || (d.reps || []).some(x => x !== "" && x != null));
  el.classList.toggle("done", !!f);
}

/* ---------- PROGRESSION ---------- */
const TESTS = [
  ["cooper", "Cooper 12'", "m", 1], ["maxpu", "Max tractions", "reps", 1], ["maxpush", "Max pompes", "reps", 1],
  ["maxdips", "Max dips", "reps", 1], ["maxt2b", "Max T2B strictes", "reps", 1],
  ["corde", "Max tractions supination", "reps", 1]
];
function showProg() {
  let rows = TESTS.map(t => {
    const a = parseFloat((get(K("J1", 0, t[0])).reps || [])[0]);
    const b = parseFloat((get(K("J14", 0, t[0])).reps || [])[0]);
    let d = "—", cls = "";
    if (!isNaN(a) && !isNaN(b)) {
      const diff = b - a, pct = a ? Math.round(diff / a * 1000) / 10 : 0;
      d = (diff > 0 ? "+" : "") + Math.round(diff * 10) / 10 + " " + t[2] + " (" + (pct > 0 ? "+" : "") + pct + "%)";
      cls = diff > 0 ? "pos" : (diff < 0 ? "neg" : "");
    }
    return "<tr><td>" + t[1] + "</td><td>" + (isNaN(a) ? "—" : a) + "</td><td>" + (isNaN(b) ? "—" : b) + '</td><td class="d ' + cls + '">' + d + "</td></tr>";
  }).join("");

  let ups = [], wods = [];
  PROGRAM.weeks.forEach(w => w.sessions.forEach(s => s.blocks.forEach((b, bi) => b.items.forEach(it => {
    const d = DATA[K(s.id, bi, it.id)];
    if (!d) return;
    if (d.up) ups.push(s.id + " · " + it.name);
    if (b.wod && d.score) wods.push(s.id + " · " + it.name + " → <b>" + esc(d.score) + "</b>");
  }))));

  open_("📈 Progression", '<div class="prog"><table><tr><th>Test</th><th>Jour 1</th><th>Jour 14</th><th>Δ</th></tr>' + rows + "</table>"
    + '<div class="bt">Scores WOD</div>' + (wods.length ? wods.map(x => '<div class="pill" style="display:block;margin-bottom:5px">' + x + "</div>").join("") : '<div class="presc">Aucun score enregistré.</div>')
    + '<div class="bt">Marqués ↑ (à durcir au Bloc 4)</div>' + (ups.length ? ups.map(x => '<span class="pill">' + esc(x) + "</span>").join("") : '<div class="presc">Rien pour l\'instant.</div>')
    + "</div>");
}

function doExport() {

  const a = document.createElement("a");

function buildResume() {
  let out = "=== MON BILAN — BLOC 3 INVICTUS POIDS DE CORPS ===\nDate : " + new Date().toLocaleDateString("fr-FR") + "\n";
  PROGRAM.weeks.forEach(w => {
    let wtxt = "";
    w.sessions.forEach(s => {
      let stxt = "";
      s.blocks.forEach((b, bi) => b.items.forEach(it => {
        const d = DATA[K(s.id, bi, it.id)];
        if (!d) return;
        if (b.wod) {
          if (!d.score) return;
          stxt += " • " + it.name + " → " + d.score + (d.up ? " ↑" : "") + "\n";
        } else {
          const r = (d.reps || []).filter(x => x !== "" && x != null);
          if (!r.length && !d.note) return;
          stxt += " • " + it.name + (d.lest ? " [lest " + d.lest + "kg]" : "")
            + (r.length ? " → [" + r.join(",") + "] " + it.unit : "")
            + (d.rpe ? " RPE" + d.rpe : "") + (d.up ? " ↑" : "") + "\n";
        }
        if (d.note) stxt += "   Note : " + d.note + "\n";
      }));
      if (stxt) wtxt += " " + s.id + " — " + s.name + "\n" + stxt;
    });
    if (wtxt) out += "\n── SEMAINE " + w.n + " ──\n" + wtxt;
  });
  out += "\n=== DEMANDE ===\nVoici mon bilan Bloc 3 (poids de corps). Analyse mes progressions et crée mon Bloc 4.\n";
  return out;
}
function showResume() {
  open_("🤖 Résumé à coller dans Claude", '<textarea id="box" readonly>' + esc(buildResume()) + "</textarea>");
}
function open_(t, html) {
  document.getElementById("mtitle").textContent = t;
  document.getElementById("mcontent").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function closeModal() { document.getElementById("modal").classList.remove("on"); }
function copyBox() {
  const b = document.getElementById("box");
  const txt = b ? b.value : document.getElementById("mcontent").innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => alert("Copié ✓"), () => fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); alert("Copié ✓"); } catch (e) { alert("Copie manuelle nécessaire"); }
  document.body.removeChild(ta);
}

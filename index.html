<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bloc 4 — Muscu / Haltéro / Poids de corps</title>
<style>
:root{
  --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#28303f;
  --txt:#e8edf5; --dim:#8b97ab; --acc:#ff6b35; --acc2:#4ade80; --blue:#38bdf8; --warn:#fbbf24; --purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.4px;font-weight:700}
h1 span{color:var(--acc)}
.sync{font-size:11px;color:var(--dim);white-space:nowrap}
.sync.ok{color:var(--acc2)} .sync.err{color:var(--warn)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#0b0e14}
main{padding:14px 14px 90px}
.weeknote{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:11px 13px;border-radius:10px;font-size:13px;color:var(--dim);margin-bottom:14px}
.weeknote b{color:var(--txt)}
.prog-bar{display:flex;gap:3px;margin:10px 0 14px}
.pdot{flex:1;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.pdot.ok{background:var(--acc2);border-color:var(--acc2)}
.pdot.cur{background:var(--acc);border-color:var(--acc)}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sess.isdone{opacity:.75;border-color:#4ade8033}
.sess.iscur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.shead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.sid{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;
  font-weight:800;padding:4px 8px;color:var(--acc);flex:0 0 auto}
.sess.isdone .sid{color:var(--acc2)}
.stitle{flex:1;min-width:0}
.stitle b{display:block;font-size:14px;font-weight:700}
.stitle small{color:var(--dim);font-size:11.5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;flex:0 0 auto}
.tag.MUSCU{background:#ff6b3522;color:var(--acc)}
.tag.HALTERO{background:#fbbf2422;color:var(--warn)}
.tag.PDC{background:#4ade8022;color:var(--acc2)}
.tag.TEST{background:#38bdf822;color:var(--blue)}
.chev{color:var(--dim);font-size:12px;flex:0 0 auto}
.sbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.sess.open .sbody{display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px}
.chip.hi{color:var(--blue);border-color:#38bdf844}
.focus{font-size:12.5px;color:var(--dim);margin:0 0 12px;padding:10px;background:var(--panel2);
  border-radius:9px;border-left:3px solid var(--blue)}
.focus b{color:var(--txt)}
.bt{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--acc);margin:16px 0 8px;text-transform:uppercase}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.ex.done{border-color:#4ade8055;background:#4ade800d}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh b{flex:1;font-size:13.5px;font-weight:700}
.presc{font-size:12px;color:var(--dim);margin:3px 0 8px}
.target{font-size:11px;color:var(--blue);margin-bottom:8px}
.hist{font-size:11.5px;color:var(--purple);background:#a78bfa14;border:1px solid #a78bfa33;
  border-radius:8px;padding:6px 9px;margin-bottom:8px}
.hist b{color:#c4b5fd}
.grid{display:grid;gap:5px;margin-bottom:8px;overflow-x:auto}
.glabel{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.grid input{background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px 3px;text-align:center;font-size:15px;font-weight:600;
  font-family:inherit;width:100%;min-width:0}
.grid input:focus{outline:none;border-color:var(--acc)}
.grid input.wgt{border-color:#fbbf2444;color:var(--warn)}
.score input{width:100%;background:var(--bg);border:1px solid var(--acc);color:var(--txt);
  border-radius:9px;padding:11px;font-size:16px;font-weight:700;font-family:inherit;text-align:center}
.note{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:34px}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.up{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
.up.on{background:var(--acc2);border-color:var(--acc2);color:#0b0e14}
.rpe{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
.finish{width:100%;margin-top:16px;padding:14px;border-radius:11px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--acc2);border:1px solid var(--acc2);color:#0b0e14}
.finish.re{background:var(--panel2);border-color:var(--line);color:var(--dim)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(11,14,20,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button.p{background:var(--acc);border-color:var(--acc);color:#0b0e14}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:760px;margin:30px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.mbox h3{margin:0 0 12px;font-size:15px}
.mbox textarea{width:100%;height:52vh;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;resize:vertical}
.prog table{width:100%;border-collapse:collapse;font-size:13px}
.prog th,.prog td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.prog th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.prog td.d{font-weight:700}
.prog td.d.pos{color:var(--acc2)} .prog td.d.neg{color:#f87171}
.pill{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin:0 6px 5px 0}
.hline{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>BLOC 4 — <span>10 JOURS</span></h1>
    <div class="sync" id="sync">…</div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="bar">
  <button onclick="showProg()">📈 Progression</button>
  <button onclick="doExport()">💾 Export</button>
  <button class="p" onclick="showResume()">🤖 Résumé</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <div id="mcontent"></div>
    <div class="row2" style="margin-top:12px">
      <button class="up" style="flex:1;padding:11px" onclick="copyBox()">📋 Copier</button>
      <button class="up" style="flex:1;padding:11px" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   BLOC 4 — 10 jours · rotation MUSCU → HALTÉRO+WOD → POIDS DE CORPS
   Salle CrossFit sans machines (barre olympique, rack, haltères, KB,
   anneaux, barre de traction, box, corde, rameur, ski erg, air bike, tapis).
   Charges en LIVRES (lb), comme au Bloc 2.
   ========================================================================= */

const PROGRAM = {
  store: "prog_logs_v6",
  bloc: "BLOC 4 — MUSCU / HALTÉRO / POIDS DE CORPS (10 jours)",
  sessions: [

  /* ---------------------------------------------------------------- J1 */
  {
    id:"J1", day:"JOUR 1", name:"MUSCU A — Jambes & tirage", tag:"MUSCU", dur:"~55 min",
    focus:"<b>Objectif :</b> reconstruire la base de force sur le bas du corps après 4 semaines sans barre. On repart 10 % sous tes charges de fin de Bloc 2 pour laisser la technique revenir, puis on remonte. Le gainage bras tendus est ajouté partout : tu n'as tenu que 3 gainages sur 7 au Bloc 3.",
    blocks:[
      { title:"FORCE", items:[
        { id:"bs", ex:"back_squat", name:"Back Squat", presc:"5 séries de 5 — repos 2'30''", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : 170 lb", target:"Départ 145-150 lb. Si les 5×5 passent en RPE 8, +10 lb au J4 du prochain bloc." },
        { id:"bul", ex:"bulgare", name:"Fentes bulgares haltères", presc:"3 séries de 10 par jambe — repos 90''", sets:3, unit:"reps/jbe", w:1,
          target:"Charge par haltère. Pied arrière sur un box." },
        { id:"sdt", ex:"rdl", name:"Soulevé de terre roumain", presc:"3 séries de 10 — repos 90''", sets:3, unit:"reps", w:1,
          target:"Jambes quasi tendues, dos plat, on sent les ischios." }
      ]},
      { title:"TIRAGE", items:[
        { id:"tl", ex:"trac_lest", name:"Tractions lestées strictes", presc:"4 séries de 6 — repos 2'", sets:4, unit:"reps", w:1,
          ref:"Bloc 2 : 22 lb × 6 · Bloc 3 : 21 tractions strictes à vide",
          target:"Ton point fort. Charge = lest en lb. Vise 25 lb × 6." },
        { id:"row", ex:"row_hal", name:"Rowing haltère 1 bras", presc:"3 séries de 12 par bras — repos 75''", sets:3, unit:"reps/bras", w:1 }
      ]},
      { title:"GAINAGE", items:[
        { id:"gain", ex:"gain_bt", name:"Gainage bras tendus", presc:"4 × 45'' — repos 30''", sets:4, unit:"sec",
          ref:"Bloc 3 : 3 gainages de 30'' tenus sur 7",
          target:"Note les secondes réellement tenues sans casser." }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J2 */
  {
    id:"J2", day:"JOUR 2", name:"HALTÉRO A — Clean & Jerk + WOD", tag:"HALTERO", dur:"~55 min",
    focus:"<b>Objectif :</b> remettre le C&J en place à charge modérée avant de chercher lourd. Ton C&J est passé de 95 à 140 lb au Bloc 2 : c'est ta meilleure progression, on la relance. Le WOD (Grace allégée) travaille le C&J en fatigue.",
    blocks:[
      { title:"TECHNIQUE", items:[
        { id:"pc", ex:"power_clean", name:"Power clean", presc:"5 séries de 3 — repos 2'", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : C&J max 140 lb", target:"70-75 % du max : 95-105 lb. Vitesse sous la barre, pas la charge." },
        { id:"jerk", ex:"split_jerk", name:"Split jerk", presc:"5 séries de 2 — repos 2'", sets:5, unit:"reps", w:1,
          target:"Fente franche, bras verrouillés avant de recevoir." }
      ]},
      { title:"MONTÉE EN CHARGE", items:[
        { id:"cj", ex:"cj_max", name:"Clean & Jerk — 5 singles montants", presc:"1 rep par série, on monte à chaque série", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : 140 lb", target:"Dernière série = lourd du jour, pas un max. Arrête si la technique casse." }
      ]},
      { title:"WOD — GRACE ALLÉGÉE", wod:true, items:[
        { id:"wod", ex:"wod_grace", name:"30 Clean & Jerk @ 95 lb — for time", presc:"Barre au sol à chaque rep. Découpe en séries de 5 dès que ça brûle.", score:"ex : 6'40" }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J3 */
  {
    id:"J3", day:"JOUR 3", name:"POIDS DE CORPS A — Poussée", tag:"PDC", dur:"45-50 min",
    focus:"<b>Ton point faible n°1.</b> Bloc 3 : 33 pompes et 11 dips en max, contre 55 et 20 attendus — alors que tu as encaissé 120 pompes en volume fractionné et 150 sur Barbara. Tu tiens le volume, tu plafonnes sur la série max. Donc ici : séries courtes et lourdes en qualité, pas du volume en plus.",
    blocks:[
      { title:"FORCE — DIPS", items:[
        { id:"dip", ex:"dips_force", name:"Dips stricts", presc:"6 séries de 4 — repos 2' — élastique ou négatives 5'' si échec", sets:6, unit:"reps",
          ref:"Bloc 3 : 11 dips max", target:"4 reps propres et explosives. Si tu passes les 6×4, ajoute du lest au bloc suivant." },
        { id:"pdia", ex:"pompe_dia", name:"Pompes diamant", presc:"4 séries de 8 — repos 90''", sets:4, unit:"reps",
          target:"Coudes au corps, poitrine au sol." }
      ]},
      { title:"AMRAP 12'00''", wod:true, items:[
        { id:"amrap", ex:"amrap_push", name:"AMRAP 12' — 5 dips / 10 pompes / 15 air squats", presc:"Le plus de tours possible en 12 minutes.", score:"ex : 9 tours + 5" }
      ]},
      { title:"GAINAGE", items:[
        { id:"gain", ex:"gain_bt", name:"Gainage bras tendus", presc:"5 × 45'' — repos 30''", sets:5, unit:"sec",
          ref:"Bloc 3 : 3/7 tenus", target:"Sans décoller de main. Note les secondes tenues." }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J4 */
  {
    id:"J4", day:"JOUR 4", name:"MUSCU B — Poussée haut du corps", tag:"MUSCU", dur:"~55 min",
    focus:"<b>Correction du Bloc 2 :</b> le 4×10 à 155 lb au développé couché n'était pas tenable, et ton shoulder press régressait en reps. On repasse en 5×5 lourd (force) plutôt qu'en séries longues — c'est le schéma qui débloque un plateau de poussée.",
    blocks:[
      { title:"FORCE", items:[
        { id:"dc", ex:"bench", name:"Développé couché", presc:"5 séries de 5 — repos 2'30''", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : 4×10 à 155 lb non tenu", target:"Départ 145-155 lb sur 5 reps. Monte de 5 lb quand les 5×5 passent." },
        { id:"dm", ex:"ohp", name:"Développé militaire barre (strict)", presc:"4 séries de 8 — repos 2'", sets:4, unit:"reps", w:1,
          target:"Debout, sans élan de jambes. Gainage serré." },
        { id:"dipl", ex:"dips_lest", name:"Dips lestés", presc:"4 séries de 6 — repos 2'", sets:4, unit:"reps", w:1,
          ref:"Bloc 3 : 11 dips à vide", target:"Charge = lest. Si 6 reps à vide sont dures, reste à vide et note 0." }
      ]},
      { title:"ACCESSOIRES", items:[
        { id:"dinc", ex:"dev_incl", name:"Développé incliné haltères", presc:"3 séries de 12 — repos 75''", sets:3, unit:"reps", w:1 },
        { id:"elev", ex:"elev_lat", name:"Élévations latérales", presc:"3 séries de 15 — repos 60''", sets:3, unit:"reps", w:1 },
        { id:"skull", ex:"skull", name:"Barre au front (skull crusher)", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1 }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J5 */
  {
    id:"J5", day:"JOUR 5", name:"HALTÉRO B — Arraché + WOD", tag:"HALTERO", dur:"~55 min",
    focus:"<b>Mobilité épaules et poignets</b> — l'autre point faible relevé au Bloc 2 (« dur pour les poignets » sur l'OHS, « monte peu » au front squat). L'overhead squat en début de séance sert autant de mobilité que de force.",
    blocks:[
      { title:"MOBILITÉ & FORCE", items:[
        { id:"ohs", ex:"ohs", name:"Overhead squat", presc:"5 séries de 5 — repos 2' — barre à vide puis charge légère", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : gênant pour les poignets", target:"Descends aussi bas que la mobilité le permet, pas plus. Priorité : bras verrouillés." },
        { id:"ps", ex:"power_snatch", name:"Power snatch", presc:"6 séries de 2 — repos 2'", sets:6, unit:"reps", w:1,
          target:"65-70 % : reste léger, cherche le placement." }
      ]},
      { title:"MONTÉE EN CHARGE", items:[
        { id:"sn", ex:"snatch_max", name:"Arraché — 5 singles montants", presc:"1 rep par série, on monte à chaque série", sets:5, unit:"reps", w:1,
          target:"Lourd du jour, technique intacte." }
      ]},
      { title:"WOD — ISABEL ALLÉGÉE", wod:true, items:[
        { id:"wod", ex:"wod_isabel", name:"30 arrachés @ 75 lb — for time", presc:"Power snatch autorisé. Barre au sol à chaque rep.", score:"ex : 5'10" }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J6 */
  {
    id:"J6", day:"JOUR 6", name:"POIDS DE CORPS B — Tirage & gainage", tag:"PDC", dur:"45-50 min",
    focus:"<b>Exploiter ton point fort.</b> 21 tractions strictes au Bloc 3, seul objectif Invictus dépassé (seuil 17). En face, tes toes-to-bar stricts plafonnent à 10 pour 18 attendus : c'est le déficit de gainage, pas de dos. D'où le travail strict de T2B ici.",
    blocks:[
      { title:"FORCE — TIRAGE", items:[
        { id:"tr", ex:"trac_str", name:"Tractions strictes lestées", presc:"6 séries de 4 — repos 2'", sets:6, unit:"reps", w:1,
          ref:"Bloc 3 : 21 max à vide · Bloc 2 : 22 lb × 6", target:"Charge = lest en lb. Temps d'arrêt 1'' bras tendus en bas." },
        { id:"sup", ex:"trac_sup", name:"Tractions supination", presc:"4 séries de 8 — repos 90''", sets:4, unit:"reps",
          ref:"Bloc 3 : 10 max", target:"Objectif Invictus : 15 d'affilée. Lest si les 4×8 passent." }
      ]},
      { title:"GAINAGE SPÉCIFIQUE", items:[
        { id:"t2b", ex:"t2b", name:"Toes-to-bar stricts", presc:"6 séries de 5 — repos 90'' — sans balancier", sets:6, unit:"reps",
          ref:"Bloc 3 : 10 max", target:"Si 5 stricts sont impossibles : genoux-poitrine stricts, même volume." },
        { id:"lat", ex:"gain_lat", name:"Gainage latéral", presc:"4 × 40'' par côté — repos 30''", sets:4, unit:"sec/côté" }
      ]},
      { title:"AMRAP 12'00''", wod:true, items:[
        { id:"amrap", ex:"amrap_pull", name:"AMRAP 12' — 3 tractions / 6 T2B / 9 burpees", presc:"Le plus de tours possible en 12 minutes.", score:"ex : 7 tours + 3" }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J7 */
  {
    id:"J7", day:"JOUR 7", name:"MUSCU C — Chaîne postérieure", tag:"MUSCU", dur:"~55 min",
    focus:"<b>Le soulevé de terre est ton mouvement le plus lourd</b> (235 → 275 lb au Bloc 2). On repart à 85 % pour un travail en séries de 3, plus sûr après une coupure, et on ajoute du volume fessiers/ischios que le Bloc 3 n'a pas pu solliciter.",
    blocks:[
      { title:"FORCE", items:[
        { id:"dl", ex:"deadlift", name:"Soulevé de terre", presc:"5 séries de 3 — repos 3'", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : 275 lb", target:"Départ 230-240 lb. Dos verrouillé, on ne cherche pas le max ce bloc." },
        { id:"ht", ex:"hip_thrust", name:"Hip thrust barre", presc:"4 séries de 10 — repos 90''", sets:4, unit:"reps", w:1 },
        { id:"gm", ex:"good_morning", name:"Good morning", presc:"3 séries de 12 — repos 90'' — charge légère", sets:3, unit:"reps", w:1 }
      ]},
      { title:"DOS & BRAS", items:[
        { id:"rowb", ex:"row_barre", name:"Rowing barre penché", presc:"4 séries de 8 — repos 90''", sets:4, unit:"reps", w:1 },
        { id:"curl", ex:"curl", name:"Curl haltères", presc:"3 séries de 12 — repos 60''", sets:3, unit:"reps", w:1 }
      ]},
      { title:"FINISHER", items:[
        { id:"farm", ex:"farmer", name:"Farmer walk", presc:"4 × 40 m — repos 90''", sets:4, unit:"m", w:1,
          target:"Charge = poids par main. Épaules basses, gainage serré." }
      ]}
    ]
  },

  /* ---------------------------------------------------------------- J8 */
  {
    id:"J8", day:"JOUR 8", name:"HALTÉRO C — Front squat / Thruster + WOD", tag:"HALTERO", dur:"~55 min",
    focus:"<b>Front rack.</b> Tes notes du Bloc 2 disaient « monte peu » sur front squat et thruster : c'est une limite de position, pas de jambes. Front squat lourd puis Fran pour l'appliquer en fatigue.",
    blocks:[
      { title:"FORCE", items:[
        { id:"fs", ex:"front_squat", name:"Front squat", presc:"5 séries de 5 — repos 2'30''", sets:5, unit:"reps", w:1,
          ref:"Bloc 2 : position inconfortable", target:"Coudes hauts. Si les poignets bloquent : prise 2 doigts ou sangles." },
        { id:"pp", ex:"push_press", name:"Push press", presc:"5 séries de 3 — repos 2'", sets:5, unit:"reps", w:1 },
        { id:"thr", ex:"thruster", name:"Thruster", presc:"4 séries de 6 — repos 2'", sets:4, unit:"reps", w:1,
          target:"Un seul mouvement fluide du squat au verrouillage." }

function fetchTimeout(url, opts, ms){
  const ctl = new AbortController();

}

/* ---------- ÉTAT DES SÉANCES ---------- */
function isDone(s){ return !!meta().done[s.id]; }
function doneDate(s){ return meta().done[s.id] || ""; }
function filledCount(s){
  let tot=0, ok=0;
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    tot++;
    const d = DATA[K(s.id,bi,it.id)];
    if(d && (b.wod ? d.score : ((d.reps||[]).some(x=>x!==""&&x!=null) || (d.poids||[]).some(x=>x!==""&&x!=null) || d.note))) ok++;
  }));
  return [ok,tot];
}
function curIndex(){
  for(let i=0;i<SESS.length;i++) if(!isDone(SESS[i])) return i;
  return SESS.length - 1;   // bloc terminé : on reste sur la dernière
}
function blocFini(){ return SESS.every(isDone); }
function finishSession(id){
  const s = SESS.find(x=>x.id===id); if(!s) return;
  const [ok,tot] = filledCount(s);
  if(ok===0 && !confirm("Aucune perf notée sur cette séance. La marquer quand même comme faite ?")) return;
  meta().done[id] = new Date().toISOString().slice(0,10);
  openId = null; view = "today"; scheduleSave(); render(); window.scrollTo(0,0);
}
function reopenSession(id){
  delete meta().done[id];
  openId = id; scheduleSave(); render(); window.scrollTo(0,0);
}

/* ---------- HISTORIQUE D'UN EXERCICE ---------- */
/* Cherche la dernière fois que cet exercice a été renseigné, avant la séance courante. */
function prevPerf(exSlug, curIdx){
  if(!exSlug) return null;
  for(let i=curIdx-1;i>=0;i--){
    const s = SESS[i];
    for(let bi=0;bi<s.blocks.length;bi++){
      for(const it of s.blocks[bi].items){
        if(it.ex !== exSlug) continue;
        const d = DATA[K(s.id,bi,it.id)];
        if(!d) continue;
        const r = (d.reps||[]).filter(x=>x!==""&&x!=null);
        const p = (d.poids||[]).filter(x=>x!==""&&x!=null);
        if(r.length || p.length || d.score) return { sess:s, reps:r, poids:p, score:d.score, unit:it.unit };
      }
    }
  }
  return null;
}
function histLine(it, curIdx){
  const p = prevPerf(it.ex, curIdx);
  if(p){
    let txt = "<b>" + esc(p.sess.day.replace("JOUR ","J")) + "</b> · ";
    if(p.poids.length) txt += "<b>" + p.poids.join(" / ") + " lb</b> — ";
    if(p.reps.length) txt += p.reps.join(", ") + " " + esc(p.unit||"");
    else if(p.score) txt += esc(p.score);
    return '<div class="hist">↩︎ Dernière fois : ' + txt + "</div>";
  }
  if(it.ref) return '<div class="hist">↩︎ Référence : ' + esc(it.ref) + "</div>";
  return "";
}

function toggleSess(id){

function setRep(k,i,v){ const d=get(k); d.reps=d.reps||[]; d.reps[i]=v; scheduleSave(); markDone(k); }
function setPoids(k,i,v){ const d=get(k); d.poids=d.poids||[]; d.poids[i]=v; scheduleSave(); markDone(k); }
function setF(k,f,v){ get(k)[f]=v; scheduleSave(); markDone(k); }
function toggleUp(k){ const d=get(k); d.up=!d.up; scheduleSave(); render(); }
function markDone(k){
  const el = document.getElementById("ex_" + k.replace(/\|/g,"_"));

  const d = DATA[k];
  const f = d && (d.score || (d.reps||[]).some(x=>x!==""&&x!=null) || (d.poids||[]).some(x=>x!==""&&x!=null));
  el.classList.toggle("done", !!f);
}

    if(!isNaN(a) && !isNaN(b)){
      const diff = b - a, pct = a ? Math.round(diff/a*1000)/10 : 0;
      d = (diff>0?"+":"") + Math.round(diff*10)/10 + " " + t[2] + " (" + (pct>0?"+":"") + pct + "%)";
      cls = diff>0 ? "pos" : (diff<0 ? "neg" : "");
    }
    return "<tr><td>" + t[1] + "</td><td>" + a + "</td><td>" + (isNaN(b)?"—":b) + '</td><td class="d ' + cls + '">' + d + "</td></tr>";
  }).join("");

  /* meilleures charges du bloc, par exercice */
  const best = {};
  SESS.forEach((s,i) => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    if(!it.w || !it.ex) return;
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    (d.poids||[]).forEach(v => {
      const n = parseFloat(v);
      if(isNaN(n)) return;
      if(!best[it.ex] || n > best[it.ex].v) best[it.ex] = { v:n, name:it.name, sess:s.day.replace("JOUR ","J") };
    });
  })));
  const bestRows = Object.keys(best).map(k =>
    "<tr><td>" + esc(best[k].name) + "</td><td colspan=2><b>" + best[k].v + " lb</b></td><td>" + esc(best[k].sess) + "</td></tr>"
  ).join("");

  let ups = [], wods = [];
  SESS.forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    if(d.up) ups.push(s.day.replace("JOUR ","J") + " · " + it.name);
    if(b.wod && d.score) wods.push(s.day.replace("JOUR ","J") + " · " + it.name + " → <b>" + esc(d.score) + "</b>");
  })));

  open_("📈 Progression",
    '<div class="prog"><div class="bt">Retest — Bloc 3 J1 vs Bloc 4 J10</div>'
    + "<table><tr><th>Test</th><th>Bloc 3</th><th>J10</th><th>Δ</th></tr>" + rows + "</table>"
    + '<div class="bt">Charges les plus lourdes du bloc</div>'
    + (bestRows ? "<table>" + bestRows + "</table>" : '<div class="presc">Aucune charge notée pour l\'instant.</div>')
    + '<div class="bt">Scores WOD</div>'
    + (wods.length ? wods.map(x => '<div class="pill" style="display:block;margin-bottom:5px">' + x + "</div>").join("") : '<div class="presc">Aucun score enregistré.</div>')
    + '<div class="bt">Marqués ↑ (à durcir au Bloc 5)</div>'
    + (ups.length ? ups.map(x => '<span class="pill">' + esc(x) + "</span>").join("") : '<div class="presc">Rien pour l\'instant.</div>')
    + "</div>");
}

/* ---------- EXPORT / RÉSUMÉ ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify({ store:STORE, bloc:PROGRAM.bloc, date:new Date().toISOString(), data:DATA }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bloc4-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function buildResume(){
  let out = "=== MON BILAN — BLOC 4 (MUSCU / HALTÉRO / POIDS DE CORPS) ===\n"
    + "Date : " + new Date().toLocaleDateString("fr-FR") + "\n"
    + "Séances terminées : " + SESS.filter(isDone).length + "/10\n";
  SESS.forEach(s => {
    let stxt = "";
    s.blocks.forEach((b,bi) => b.items.forEach(it => {
      const d = DATA[K(s.id,bi,it.id)];
      if(!d) return;
      if(b.wod){
        if(!d.score) return;
        stxt += " • " + it.name + " → " + d.score + (d.up?" ↑":"") + "\n";
      } else {
        const r = (d.reps||[]).filter(x=>x!==""&&x!=null);
        const p = (d.poids||[]).filter(x=>x!==""&&x!=null);
        if(!r.length && !p.length && !d.note) return;
        stxt += " • " + it.name
          + (p.length ? " [" + p.join("/") + " lb]" : "")
          + (r.length ? " → [" + r.join(",") + "] " + it.unit : "")
          + (d.rpe ? " RPE" + d.rpe : "") + (d.up?" ↑":"") + "\n";
      }
      if(d.note) stxt += "   Note : " + d.note + "\n";
    }));
    if(stxt || isDone(s))
      out += "\n── " + s.day + " — " + s.name + (isDone(s) ? " (fait le " + doneDate(s) + ")" : " (non terminée)") + " ──\n" + stxt;
  });
  out += "\n=== DEMANDE ===\nVoici mon bilan Bloc 4. Analyse mes progressions et crée mon Bloc 5 (10 jours, même rotation).\n";
  return out;
}
function showResume(){ open_("🤖 Résumé à coller dans Claude", '<textarea id="box" readonly>' + esc(buildResume()) + "</textarea>"); }
function open_(t, html){
  document.getElementById("mtitle").textContent = t;
  document.getElementById("mcontent").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function copyBox(){
  const b = document.getElementById("box");
  const txt = b ? b.value : document.getElementById("mcontent").innerText;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert("Copié ✓"), ()=>fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Copié ✓"); }catch(e){ alert("Copie manuelle nécessaire"); }
  document.body.removeChild(ta);
}

  try{ DATA = JSON.parse(localStorage.getItem(STORE) || "{}"); }catch(e){ DATA = {}; }
  meta();
  render();                       // rendu immédiat depuis le local
  setSync("↻ sync…","");

}

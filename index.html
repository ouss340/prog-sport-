<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bloc 7 — Muscu + CrossFit</title>
<style>
:root{
  --bg:#0b0e14; --panel:#141924; --panel2:#1b2230; --line:#28303f;
  --txt:#e8edf5; --dim:#8b97ab; --acc:#ff6b35; --acc2:#4ade80; --blue:#38bdf8; --warn:#fbbf24; --purple:#a78bfa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:50;background:rgba(11,14,20,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:15px;margin:0;letter-spacing:.4px;font-weight:700}
h1 span{color:var(--acc)}
.sync{font-size:11px;color:var(--dim);white-space:nowrap}
.sync.ok{color:var(--acc2)} .sync.err{color:var(--warn)}
nav{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{background:var(--acc);border-color:var(--acc);color:#0b0e14}
main{padding:14px 14px 90px}
.weeknote{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);
  padding:11px 13px;border-radius:10px;font-size:13px;color:var(--dim);margin-bottom:14px}
.weeknote b{color:var(--txt)}
.prog-bar{display:flex;gap:3px;margin:10px 0 14px}
.pdot{flex:1;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.pdot.ok{background:var(--acc2);border-color:var(--acc2)}
.pdot.cur{background:var(--acc);border-color:var(--acc)}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.sess.isdone{opacity:.75;border-color:#4ade8033}
.sess.iscur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.shead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.sid{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:11px;
  font-weight:800;padding:4px 8px;color:var(--acc);flex:0 0 auto}
.sess.isdone .sid{color:var(--acc2)}
.stitle{flex:1;min-width:0}
.stitle b{display:block;font-size:14px;font-weight:700}
.stitle small{color:var(--dim);font-size:11.5px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:3px 7px;border-radius:6px;flex:0 0 auto}
.tag.MUSCU{background:#ff6b3522;color:var(--acc)}
.tag.HALTERO{background:#fbbf2422;color:var(--warn)}
.tag.PDC{background:#4ade8022;color:var(--acc2)}
.tag.TEST{background:#38bdf822;color:var(--blue)}
.tag.WOD{background:#a78bfa22;color:var(--purple)}
.tag.FORCE{background:#ff6b3522;color:var(--acc)}
.tag.CARDIO{background:#38bdf822;color:var(--blue)}
.chev{color:var(--dim);font-size:12px;flex:0 0 auto}
.sbody{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.sess.open .sbody{display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px}
.focus{font-size:12.5px;color:var(--dim);margin:12px 0;padding:10px;background:var(--panel2);
  border-radius:9px;border-left:3px solid var(--blue)}
.focus b{color:var(--txt)}
.verb{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc2);
  border-radius:9px;padding:11px 12px;margin:12px 0;font-size:12.5px;line-height:1.55}
.verb div{margin-bottom:3px}
.verb b{color:var(--txt)} .verb u{color:var(--blue);text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.4px}
.src{font-size:10.5px;color:var(--dim);letter-spacing:.3px;margin-top:6px;font-style:italic}
.bt{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--acc);margin:16px 0 8px;text-transform:uppercase}
.ex{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.ex.done{border-color:#4ade8055;background:#4ade800d}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh b{flex:1;font-size:13.5px;font-weight:700}
.presc{font-size:12px;color:var(--dim);margin:3px 0 8px}
.target{font-size:11px;color:var(--blue);margin-bottom:8px}
.hist{font-size:11.5px;color:var(--purple);background:#a78bfa14;border:1px solid #a78bfa33;
  border-radius:8px;padding:6px 9px;margin-bottom:8px}
.hist b{color:#c4b5fd}
.grid{display:grid;gap:5px;margin-bottom:8px;overflow-x:auto}
.glabel{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.grid input{background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px 3px;text-align:center;font-size:15px;font-weight:600;
  font-family:inherit;width:100%;min-width:0}
.grid input:focus{outline:none;border-color:var(--acc)}
.grid input.wgt{border-color:#fbbf2444;color:var(--warn)}
.score input{width:100%;background:var(--bg);border:1px solid var(--acc);color:var(--txt);
  border-radius:9px;padding:11px;font-size:16px;font-weight:700;font-family:inherit;text-align:center}
.note{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical;min-height:34px}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.up{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:8px 11px;font-size:13px;cursor:pointer;font-weight:700;font-family:inherit}
.up.on{background:var(--acc2);border-color:var(--acc2);color:#0b0e14}
.rpe{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:8px;font-size:13px;font-family:inherit}
.finish{width:100%;margin-top:16px;padding:14px;border-radius:11px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;background:var(--acc2);border:1px solid var(--acc2);color:#0b0e14}
.finish.re{background:var(--panel2);border-color:var(--line);color:var(--dim)}
.finish.pdc{background:var(--blue);border-color:var(--blue)}
.attempts{background:#38bdf80d;border:1px solid #38bdf833;border-radius:9px;padding:9px 11px;margin:12px 0;font-size:12px;color:var(--dim)}
.attempts b{color:var(--blue)}
.attempts div{margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(11,14,20,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.bar button.p{background:var(--acc);border-color:var(--acc);color:#0b0e14}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;padding:20px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:760px;margin:30px auto;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px}
.mbox h3{margin:0 0 12px;font-size:15px}
.mbox textarea{width:100%;height:52vh;background:var(--bg);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;resize:vertical}
.prog table{width:100%;border-collapse:collapse;font-size:13px}
.prog th,.prog td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.prog th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.prog td.d{font-weight:700}
.prog td.d.pos{color:var(--acc2)} .prog td.d.neg{color:#f87171}
.pill{display:inline-block;font-size:11px;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:3px 9px;margin:0 6px 5px 0}
.tag.CROSSFIT{background:#fbbf2422;color:var(--warn)}
.hright{display:flex;align-items:center;gap:8px;min-width:0}
.pbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:5px 11px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnote{font-size:11.5px;color:var(--dim);margin:-2px 0 8px;font-style:italic}
.biw{border-left:2px solid var(--acc);padding-left:8px;margin-bottom:10px}
.biw .ex{margin-bottom:7px}
.wdesc{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:9px;
  padding:9px 11px;margin:6px 0 10px;font-size:13px;line-height:1.6}
.wrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wl{flex:1;font-size:11px;color:var(--warn);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.wone{width:112px;flex:0 0 auto;background:var(--bg);border:1px solid #fbbf2455;color:var(--warn);border-radius:8px;
  padding:9px 6px;text-align:center;font-size:16px;font-weight:700;font-family:inherit}
.wone:focus{outline:none;border-color:var(--warn)}
.wone.carry{opacity:.6;font-style:italic}
.who{position:fixed;inset:0;z-index:200;background:var(--bg);overflow:auto;padding:24px 16px;display:none}
.who.on{display:block}
.whobox{max-width:420px;margin:30px auto}
.whobox h2{margin:0 0 6px;font-size:19px}
.whobox p{margin:0 0 18px;color:var(--dim);font-size:13px}
.prow{display:flex;gap:8px;margin-bottom:8px}
.pitem{flex:1;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.pitem.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pdel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:12px;
  padding:0 14px;font-size:14px;cursor:pointer;font-family:inherit}
.plink{background:none;border:0;color:var(--dim);font-size:12.5px;text-decoration:underline;cursor:pointer;
  font-family:inherit;padding:6px 0;margin-bottom:6px}
.newp{display:flex;gap:8px;margin-top:18px}
.newp input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  padding:13px;font-size:15px;font-family:inherit}
.newp input:focus{outline:none;border-color:var(--acc)}
.newp button{flex:0 0 auto;background:var(--acc);border:0;color:#0b0e14;border-radius:12px;padding:0 16px;
  font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.wclose{display:none;width:100%;margin-top:18px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.gcap{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px 2px}
.grid input{padding:8px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>BLOC <span>7</span></h1>
    <div class="hright">
      <button class="pbtn" id="pbtn" onclick="showPicker(true)">👤</button>
      <div class="sync" id="sync">…</div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="bar">
  <button onclick="showProg()">📈 Progression</button>
  <button onclick="doExport()">💾 Export</button>
  <button class="p" onclick="showResume()">🤖 Résumé</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <h3 id="mtitle"></h3>
    <div id="mcontent"></div>
    <div class="row2" style="margin-top:12px">
      <button class="up" style="flex:1;padding:11px" onclick="copyBox()">📋 Copier</button>
      <button class="up" style="flex:1;padding:11px" onclick="closeModal()">Fermer</button>
    </div>
  </div>
</div>

<div class="who" id="who">
  <div class="whobox">
    <h2>Qui s'entraîne ?</h2>
    <p>Chaque profil a ses propres séances et charges, séparées des autres.</p>
    <div id="whoList"></div>
    <div class="newp">
      <input id="newName" type="text" maxlength="24" placeholder="Prénom du nouveau profil" autocomplete="off">
      <button onclick="createProfile()">➕ Créer</button>
    </div>
    <button class="wclose" id="whoClose" onclick="hidePicker()">Fermer</button>
  </div>
</div>

<script>
/* =========================================================================
   BLOC 7 — 4 SEMAINES · 5 séances/semaine
   Lundi MUSCU pecs/biceps · Mardi CROSSFIT A (clean & jerk) · Mercredi MUSCU jambes/épaules
   Jeudi CROSSFIT B (arraché) · Vendredi MUSCU dos/triceps
   Muscu : programmée par Oussama (bi-sets) — les charges sont reprises de la dernière
   semaine du Bloc 6, sans exception, puis reportées d'une séance à l'autre.
   CrossFit : technique → travail lourd → WOD (un WOD différent à chaque séance).
   Salle CrossFit sans machines (une seule poulie). Charges en LIVRES (lb).
   w0 = charge de départ (dernier relevé réel du Bloc 6) · pas de w0 = jamais fait.
   ========================================================================= */

const REPOS_BI = "Enchaîne A1 puis A2 sans pause, puis repos avant de repartir.";

function muscuLundi(n){
  return {
    id:"S"+n+"L", day:"SEMAINE "+n+" · LUNDI", name:"MUSCU — Pecs & biceps", tag:"MUSCU", dur:"50-60 min",
    focus:"<b>4 bi-sets pecs / biceps.</b> La charge est reprise de la dernière fois : tu la changes toi-même quand tu surcharges.",
    blocks:[
      { title:"BI-SET 1", note:REPOS_BI+" Repos 2'.", items:[
        { id:"a1", ex:"bench",     name:"A1 · Développé couché",  presc:"4 séries de 5", sets:4, unit:"reps", w:1, w0:185 },
        { id:"a2", ex:"curl_barre",name:"A2 · Curl barre EZ",     presc:"4 séries de 8", sets:4, unit:"reps", w:1, w0:77 }
      ]},
      { title:"BI-SET 2", note:REPOS_BI+" Repos 90''.", items:[
        { id:"b1", ex:"dev_incl",  name:"A1 · Développé incliné haltères", presc:"4 séries de 10", sets:4, unit:"reps", w:1, w0:55, wlabel:"Charge par haltère (lb)" },
        { id:"b2", ex:"curl_db_assis", name:"A2 · Curl haltères assis",     presc:"4 séries de 10", sets:4, unit:"reps", w:1, wlabel:"Charge par haltère (lb)" }
      ]},
      { title:"BI-SET 3", note:REPOS_BI+" Repos 90''.", items:[
        { id:"c1", ex:"dips_anneaux", name:"A1 · Dips anneaux",             presc:"3 séries de 8", sets:3, unit:"reps", w:1, wlabel:"Lest (lb) — optionnel" },
        { id:"c2", ex:"curl_poulie",  name:"A2 · Curl poulie barre droite", presc:"3 séries de 12", sets:3, unit:"reps", w:1 }
      ]},
      { title:"BI-SET 4", note:REPOS_BI+" Repos 60''.", items:[
        { id:"d1", ex:"crossover_elast", name:"A1 · Vis-à-vis haut → bas pecs (élastique)", presc:"3 séries de 15", sets:3, unit:"reps", w:1, wlabel:"Élastique (couleur)", cue:"Pas de poulie double à la salle : élastique fixé en haut, tu tires vers le bas et l'intérieur." },
        { id:"d2", ex:"curl_mart",       name:"A2 · Curl marteau",                          presc:"3 séries de 12", sets:3, unit:"reps", w:1, w0:33, wlabel:"Charge par haltère (lb)" }
      ]}
    ]
  };
}

function muscuMercredi(n){
  return {
    id:"S"+n+"M", day:"SEMAINE "+n+" · MERCREDI", name:"MUSCU — Jambes & épaules", tag:"MUSCU", dur:"55-65 min",
    focus:"<b>4 bi-sets jambes / épaules.</b> La charge est reprise de la dernière fois : tu la changes toi-même quand tu surcharges.",
    blocks:[
      { title:"BI-SET 1", note:REPOS_BI+" Repos 2'30''.", items:[
        { id:"a1", ex:"back_squat", name:"A1 · Squat",                       presc:"5 séries de 5", sets:5, unit:"reps", w:1, w0:170 },
        { id:"a2", ex:"ohp",        name:"A2 · Développé militaire barre",   presc:"5 séries de 6", sets:5, unit:"reps", w:1, w0:100 }
      ]},
      { title:"BI-SET 2", note:REPOS_BI+" Repos 90''.", items:[
        { id:"b1", ex:"rdl",      name:"A1 · Soulevé de terre roumain",       presc:"3 séries de 10", sets:3, unit:"reps", w:1, w0:155 },
        { id:"b2", ex:"elev_lat", name:"A2 · Écartés latéraux haltères (épaules)", presc:"3 séries de 12", sets:3, unit:"reps", w:1, w0:22, wlabel:"Charge par haltère (lb)", cue:"⚠️ Picotements derrière la nuque notés à 22 lb au Bloc 2 : si ça revient, redescends et monte les reps." }
      ]},
      { title:"BI-SET 3", note:REPOS_BI+" Repos 90''.", items:[
        { id:"c1", ex:"bulgare",      name:"A1 · Fentes bulgares haltères", presc:"3 séries de 10 par jambe", sets:3, unit:"reps/jbe", w:1, w0:38.5, wlabel:"Charge par haltère (lb)" },
        { id:"c2", ex:"oiseau_assis", name:"A2 · Oiseau assis (arrière d'épaule)", presc:"3 séries de 12", sets:3, unit:"reps", w:1, wlabel:"Charge par haltère (lb)" }
      ]},
      { title:"BI-SET 4", note:REPOS_BI+" Repos 60''.", items:[
        { id:"d1", ex:"mollets",           name:"A1 · Mollets debout à la barre",         presc:"3 séries de 15", sets:3, unit:"reps", w:1, w0:135 },
        { id:"d2", ex:"lev_devant_poulie", name:"A2 · Élévation devant poulie (corde)",   presc:"3 séries de 12", sets:3, unit:"reps", w:1 }
      ]}
    ]
  };
}

function muscuVendredi(n){
  return {
    id:"S"+n+"V", day:"SEMAINE "+n+" · VENDREDI", name:"MUSCU — Dos & triceps", tag:"MUSCU", dur:"50-60 min",
    focus:"<b>4 bi-sets dos / triceps.</b> La charge est reprise de la dernière fois : tu la changes toi-même quand tu surcharges.",
    blocks:[
      { title:"BI-SET 1", note:REPOS_BI+" Repos 2'.", items:[
        { id:"a1", ex:"trac_lest", name:"A1 · Tractions lestées",        presc:"4 séries de 5",  sets:4, unit:"reps", w:1, w0:50, wlabel:"Lest (lb)" },
        { id:"a2", ex:"skull",     name:"A2 · Barre au front",           presc:"4 séries de 10", sets:4, unit:"reps", w:1, w0:67 }
      ]},
      { title:"BI-SET 2", note:REPOS_BI+" Repos 90''.", items:[
        { id:"b1", ex:"row_barre",  name:"A1 · Tirage barre (rowing penché)", presc:"4 séries de 8",  sets:4, unit:"reps", w:1, w0:140 },
        { id:"b2", ex:"tri_corde",  name:"A2 · Poulie triceps corde",         presc:"4 séries de 12", sets:4, unit:"reps", w:1 }
      ]},
      { title:"BI-SET 3", note:REPOS_BI+" Repos 90''.", items:[
        { id:"c1", ex:"tirage_horiz", name:"A1 · Tirage horizontal",                presc:"3 séries de 10", sets:3, unit:"reps", w:1 },
        { id:"c2", ex:"tri_supi",     name:"A2 · Poulie triceps prise supination",  presc:"3 séries de 12", sets:3, unit:"reps", w:1 }
      ]},
      { title:"BI-SET 4", note:REPOS_BI+" Repos 60''.", items:[
        { id:"d1", ex:"row_hal",      name:"A1 · Rowing haltère 1 bras",            presc:"3 séries de 12 par bras", sets:3, unit:"reps/bras", w:1, w0:55, wlabel:"Charge de l'haltère (lb)" },
        { id:"d2", ex:"tri_pronation",name:"A2 · Poulie triceps barre prise pronation", presc:"3 séries de 12", sets:3, unit:"reps", w:1 }
      ]}
    ]
  };
}

/* ---------- CROSSFIT : 8 séances, 8 WOD différents ---------- */
const CF_TECH_CLEAN = "Barre à 95 lb (le poids de ton Grace).";
const CF_TECH_SNATCH = "Barre à 75 lb (le poids de ton Isabel).";

const CF = [
  /* ---- S1 MARDI ---- */
  { id:"S1CA", day:"SEMAINE 1 · MARDI", name:"CROSSFIT A — Clean & jerk", tag:"CROSSFIT", dur:"55-60 min",
    focus:"<b>Technique → travail lourd → WOD.</b> Aujourd'hui : <b>Fran</b>, court et intense (cap 8').",
    blocks:[

/* ---------- PROFILS ----------
   Un profil = un jeu de données séparé (clé locale + clé Supabase propres).
   Oussama garde la clé d'origine ; les autres profils ont "<clé>__<prénom>".
   Rien n'est partagé : un autre profil ne peut ni lire ni écraser tes données. */

const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function slugName(n){
  return String(n||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24);
}
function storeFor(id){ return id===OWNER ? PROGRAM.store : PROGRAM.store + "__" + id; }
function loadProfiles(){
  let list = [];
  try{ list = JSON.parse(LS.get("prog_profiles") || "[]"); }catch(e){ list = []; }
  if(!Array.isArray(list)) list = [];
  return list.filter(p => p && p.id && p.name);
}
function saveProfiles(list){ LS.set("prog_profiles", JSON.stringify(list)); }
const isOwner = () => PROFILE.id === OWNER;

let DATA = {};

const SESS = PROGRAM.sessions;
const N = SESS.length;
const K = (s,b,i) => s + "|" + b + "|" + i;
const get = k => (DATA[k] = DATA[k] || { reps:[], w:"", note:"", rpe:"", up:false, score:"" });
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => parseFloat(String(v==null?"":v).replace(",","."));
const hasVal = x => x!=="" && x!=null && String(x).trim()!=="";
function meta(){
  if(!DATA.__meta || typeof DATA.__meta!=="object") DATA.__meta = {};
  if(!DATA.__meta.done) DATA.__meta.done = {};
  if(!DATA.__meta.pdcDone) DATA.__meta.pdcDone = {};
  if(!DATA.__meta.att) DATA.__meta.att = {};
  return DATA.__meta;
}
const isPdc = s => s.id.charAt(0) === "P";
const shortDay = s => s.day.replace(/SEMAINE (\d) · (\S{3})\S*/, "S$1 $2").replace("PDC ","P");

/* ---------- CHARGE UNIQUE PAR EXERCICE ----------
   Une seule case « charge » par exercice. Elle est pré-remplie avec la charge de
   la dernière fois (même exercice), ou avec la charge de départ du bloc (w0) pour Oussama.
   L'appli ne propose jamais de nouvelle charge : tu changes la case toi-même. */
function explicitW(sid, bi, it){
  const d = DATA[K(sid,bi,it.id)];
  return (d && hasVal(d.w)) ? String(d.w).trim() : "";
}
function carryW(sid, it){
  const idx = SESS.findIndex(x => x.id === sid);
  for(let i=idx-1;i>=0;i--){
    const s = SESS[i];
    for(let bi=0;bi<s.blocks.length;bi++){
      for(const o of s.blocks[bi].items){
        if(!o.w || o.ex !== it.ex) continue;
        const v = explicitW(s.id, bi, o);
        if(v) return v;
      }
    }
  }
  return (isOwner() && it.w0 != null) ? String(it.w0) : "";
}
const effW = (sid, bi, it) => explicitW(sid, bi, it) || carryW(sid, it);

/* Anciennes données (Bloc 6) : une charge par série → une seule valeur */
function normalizeData(){
  Object.keys(DATA).forEach(k => {
    const d = DATA[k];
    if(k === "__meta" || !d || typeof d !== "object") return;
    if(Array.isArray(d.poids)){
      const p = d.poids.filter(hasVal).map(String);
      if(p.length && !hasVal(d.w)){
        const uniq = p.filter((v,i) => p.indexOf(v) === i);
        d.w = uniq.length === 1 ? uniq[0] : p.join("/");
      }
      delete d.poids;
    }
  });
}

/* ---------- RÉSEAU ---------- */
function fetchTimeout(url, opts, ms){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 8000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}
function setSync(txt, cls){
  const e = document.getElementById("sync");
  if(!e) return;
  e.textContent = txt; e.className = "sync " + (cls || "");
}

/* ---------- PERSISTANCE ---------- */
function saveLocal(){ if(ready) LS.set(STORE, JSON.stringify(DATA)); }
function scheduleSave(){
  saveLocal(); setSync("● local","");
  clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 1200);
}
function pushCloud(){
  if(!ready) return;
  const key = STORE, body = JSON.stringify({ store_key:key, data:DATA, updated_at:new Date().toISOString() });
  setSync("↻ sync…","");
  fetchTimeout(SUPA_URL + "/rest/v1/training_logs?on_conflict=store_key", {
    method:"POST",
    headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY,
      "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: body
  }, 8000)
  .then(r => { if(!r.ok) throw new Error(r.status); lastCloud = Date.now(); if(key===STORE) setSync("☁︎ synchronisé","ok"); })
  .catch(() => { if(key===STORE) setSync("⚠︎ hors ligne (local OK)","err"); });
}
function pullCloud(){
  if(!ready) return Promise.resolve();
  const key = STORE;
  return fetchTimeout(SUPA_URL + "/rest/v1/training_logs?store_key=eq." + encodeURIComponent(key) + "&select=data,updated_at", {
    headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY }
  }, 8000)
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(rows => {
    if(key !== STORE) return;                       // profil changé entre-temps
    if(rows && rows[0] && rows[0].data){
      const cloud = rows[0].data;
      if(Object.keys(cloud).length >= Object.keys(DATA).length){ DATA = cloud; meta(); normalizeData(); saveLocal(); render(); }
    }
    setSync("☁︎ synchronisé","ok");
  })
  .catch(() => { if(key===STORE) setSync("⚠︎ hors ligne (local OK)","err"); });
}

/* ---------- CHARGEMENT D'UN PROFIL ---------- */
function loadData(){
  try{ DATA = JSON.parse(LS.get(STORE) || "{}"); }catch(e){ DATA = {}; }
  if(!DATA || typeof DATA !== "object") DATA = {};
  meta(); normalizeData();
  if(isOwner() && Object.keys(DATA).every(k => k === "__meta")) seedPdcFromBloc6();
}
/* Au premier lancement du Bloc 7, reprend l'état des séances poids de corps du Bloc 6.
   Les données du Bloc 6 (prog_logs_v8) ne sont ni modifiées ni supprimées. */
function seedPdcFromBloc6(){
  let old = null;
  try{ old = JSON.parse(LS.get("prog_logs_v8") || "null"); }catch(e){ old = null; }
  if(!old || typeof old !== "object") return;
  let n = 0;
  Object.keys(old).forEach(k => { if(/^P\d+\|/.test(k)){ DATA[k] = JSON.parse(JSON.stringify(old[k])); n++; } });
  const om = old.__meta || {};
  Object.keys(om.pdcDone || {}).forEach(id => { meta().pdcDone[id] = om.pdcDone[id]; n++; });
  Object.keys(om.att || {}).forEach(id => { meta().att[id] = om.att[id]; n++; });
  normalizeData();
  if(n) saveLocal();
}
function useProfile(id){
  const list = loadProfiles();
  const p = list.find(x => x.id === id);
  if(!p) return;
  if(ready){ clearTimeout(saveTimer); saveLocal(); pushCloud(); }   // enregistre le profil quitté
  PROFILE = p; STORE = storeFor(p.id); ready = true;
  LS.set("prog_profile_cur", p.id);
  loadData();
  openId = null; view = "today";
  hidePicker();
  render(); setSync("↻ sync…",""); pullCloud();
  window.scrollTo(0,0);
}
function createProfile(){
  const inp = document.getElementById("newName");
  const name = (inp.value || "").trim().slice(0,24);
  const id = slugName(name);
  if(!id){ alert("Entre un prénom."); return; }
  if(id === OWNER || id === "oussama"){ alert("Ce nom est réservé : choisis-en un autre."); return; }
  const list = loadProfiles();
  if(!list.some(p => p.id === id)){ list.push({ id:id, name:name }); saveProfiles(list); }
  inp.value = "";
  useProfile(id);
}
function addOwner(){
  const list = loadProfiles();
  if(!list.some(p => p.id === OWNER)){ list.unshift({ id:OWNER, name:OWNER_NAME }); saveProfiles(list); }
  useProfile(OWNER);
}
function removeProfile(id){
  if(id === OWNER) return;
  const list = loadProfiles();
  const p = list.find(x => x.id === id); if(!p) return;
  if(!confirm("Retirer le profil « " + p.name + " » de cet appareil ?\nSes données restent sauvegardées dans le cloud : en recréant le même prénom, tu les retrouves.")) return;
  saveProfiles(list.filter(x => x.id !== id));
  if(ready && PROFILE.id === id){ clearTimeout(saveTimer); saveLocal(); pushCloud(); ready = false; LS.del("prog_profile_cur"); showPicker(false); }
  else renderPicker();
}

}
function hidePicker(){ document.getElementById("who").classList.remove("on"); }
function renderPicker(){

  let h = "";

    h += '<div class="prow"><button class="pitem' + (cur?" cur":"") + '" onclick="useProfile(\'' + p.id + '\')">👤 ' + esc(p.name) + (cur?" ✓":"") + "</button>"
      + (p.id !== OWNER ? '<button class="pdel" title="Retirer de cet appareil" onclick="removeProfile(\'' + p.id + '\')">✕</button>' : "") + "</div>";
  });
  if(!list.some(p => p.id === OWNER))
    h += '<button class="plink" onclick="addOwner()">Je suis Oussama</button>';
  document.getElementById("whoList").innerHTML = h || '<div class="presc">Aucun profil sur cet appareil : crée le tien ci-dessous.</div>';
}

/* ---------- ÉTAT DES SÉANCES ---------- */
function isDone(s){ return isPdc(s) ? !!meta().pdcDone[s.id] : !!meta().done[s.id]; }
function doneDate(s){ return (isPdc(s) ? meta().pdcDone[s.id] : meta().done[s.id]) || ""; }
function itemFilled(b, d){
  if(!d) return false;
  if(b.wod) return !!d.score || (d.reps||[]).some(hasVal);
  return (d.reps||[]).some(hasVal) || hasVal(d.w);
}
function filledCount(s){
  let tot=0, ok=0;
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    tot++;
    const d = DATA[K(s.id,bi,it.id)];
    if(d && (itemFilled(b,d) || (!b.wod && d.note))) ok++;
  }));
  return [ok,tot];
}
function curIndex(){
  for(let i=0;i<N;i++) if(!isDone(SESS[i])) return i;
  return N - 1;
}
function blocFini(){ return SESS.every(isDone); }

function finishSession(id){
  const s = SESS.find(x=>x.id===id); if(!s) return;
  const [ok] = filledCount(s);
  if(ok===0 && !confirm("Aucune perf notée sur cette séance. La marquer quand même comme faite ?")) return;
  /* fige les charges reprises : la séance garde ce qui a été utilisé */
  s.blocks.forEach((b,bi) => { if(b.wod) return; b.items.forEach(it => {
    if(!it.w) return;
    const k = K(s.id,bi,it.id);
    if(!hasVal((DATA[k]||{}).w)){ const v = carryW(s.id,it); if(v) get(k).w = v; }
  }); });
  meta().done[id] = new Date().toISOString().slice(0,10);
  openId = null; view = "today"; scheduleSave(); render(); window.scrollTo(0,0);
}
function reopenSession(id){
  delete meta().done[id];
  openId = id; scheduleSave(); render(); window.scrollTo(0,0);
}
function finishPdc(id){
  const s = PDC.find(x=>x.id===id); if(!s) return;
  const [ok] = filledCount(s);
  if(ok===0 && !confirm("Aucune perf notée. Marquer quand même comme faite ?")) return;
  meta().pdcDone[id] = new Date().toISOString().slice(0,10);
  scheduleSave(); render(); window.scrollTo(0,0);
}
function reopenPdc(id){ delete meta().pdcDone[id]; scheduleSave(); render(); }

/* Archive la perf courante d'une séance PDC et vide les champs pour un nouvel essai */
function newAttempt(id){
  const s = PDC.find(x=>x.id===id); if(!s) return;
  const txt = perfLine(s);
  if(!txt){ alert("Rien à archiver : aucune perf notée."); return; }
  if(!confirm("Archiver la perf actuelle et repartir sur des champs vides ?")) return;
  const m = meta();
  m.att[id] = m.att[id] || [];
  m.att[id].push({ date: doneDate(s) || new Date().toISOString().slice(0,10), txt: txt });
  s.blocks.forEach((b,bi) => b.items.forEach(it => { delete DATA[K(s.id,bi,it.id)]; }));
  delete m.pdcDone[id];
  scheduleSave(); render(); window.scrollTo(0,0);
}
/* Résumé une ligne des perfs d'une séance (utilisé pour l'archive et l'historique) */
function perfLine(s){
  const parts = [];
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    if(b.wod && !it.sets){ if(d.score) parts.push(it.name + " : " + d.score); return; }
    const r = (d.reps||[]).filter(hasVal);
    if(!r.length && !hasVal(d.w)) return;
    parts.push(it.name + " " + (hasVal(d.w) ? d.w + " lb " : "") + (r.length ? r.join(", ") + " " + (it.unit||"") : ""));
  }));
  return parts.join(" · ");
}

/* ---------- HISTORIQUE D'UN EXERCICE ---------- */
function prevPerf(exSlug, curIdx){
  if(!exSlug || curIdx==null) return null;
  for(let i=curIdx-1;i>=0;i--){
    const s = SESS[i];
    for(let bi=0;bi<s.blocks.length;bi++){
      for(const it of s.blocks[bi].items){
        if(it.ex !== exSlug) continue;
        const d = DATA[K(s.id,bi,it.id)];
        if(!d) continue;
        const r = (d.reps||[]).filter(hasVal);
        const w = hasVal(d.w) ? String(d.w).trim() : "";
        if(r.length || w || d.score) return { sess:s, reps:r, w:w, score:d.score, unit:it.unit };
      }
    }
  }
  return null;
}
function histLine(it, curIdx){
  const p = prevPerf(it.ex, curIdx);
  if(p){
    let txt = "<b>" + esc(p.sess.day) + "</b> · ";
    if(p.w) txt += "<b>" + esc(p.w) + " lb</b> — ";
    if(p.reps.length) txt += esc(p.reps.join(", ")) + " " + esc(p.unit||"");
    else if(p.score) txt += esc(p.score);
    return '<div class="hist">↩︎ Dernière fois : ' + txt + "</div>";
  }
  if(it.ref) return '<div class="hist">↩︎ Référence : ' + esc(it.ref) + "</div>";
  const r = isOwner() ? REF_MAP[it.ex] : null;
  if(r && r.h.length) return '<div class="hist">↩︎ Référence <b>' + esc(r.h[0][0]) + "</b> : " + esc(r.h[0][1]) + "</div>";
  return "";
}

/* Meilleure charge notée dans CE bloc pour un exercice */
function bestThisBloc(exSlug){
  let best = null;
  SESS.concat(PDC).forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    if(it.ex !== exSlug) return;
    const d = DATA[K(s.id,bi,it.id)];
    if(!d || !hasVal(d.w)) return;
    String(d.w).split("/").forEach(v => {
      const n = num(v);
      if(isNaN(n)) return;
      if(!best || n > best.v) best = { v:n, sess:s.day.replace("SEMAINE ","S").replace("PDC ","P") };
    });
  })));
  return best;
}

  s.blocks.forEach((b,bi) => {

        + (it.desc ? '<div class="wdesc">' + it.desc.map(l => "<div>" + esc(l) + "</div>").join("") + "</div>" : "")
        + (it.cue ? '<div class="target">💡 ' + esc(it.cue) + "</div>" : "")
        + (pdc ? (it.ref ? '<div class="hist">↩︎ Référence : ' + esc(it.ref) + "</div>" : "") : histLine(it, idx));

      if(b.wod && !it.sets){
        h += '<div class="score"><input type="text" inputmode="text" placeholder="' + esc(it.score)
          + '" value="' + esc(d.score) + '" oninput="setF(\'' + k + "','score',this.value)\"></div>";
      } else {
        if(it.w){
          const exW = explicitW(s.id,bi,it);
          const val = exW || carryW(s.id,it);
          h += '<div class="wrow"><span class="wl">' + esc(it.wlabel || "Charge (lb)") + "</span>"
            + '<input class="wone' + (exW ? "" : " carry") + '" type="text" inputmode="decimal" placeholder="à noter" value="' + esc(val)
            + '" oninput="setW(\'' + k + "',this)\"></div>";

        const n = it.sets;
        h += '<div class="gcap">' + esc(it.unit) + "</div>";
        h += '<div class="grid" style="grid-template-columns:repeat(' + n + ',minmax(0,1fr))">';
        for(let i=0;i<n;i++)
          h += '<input type="text" inputmode="numeric" placeholder="—" value="'
            + esc((d.reps||[])[i]==null?"":d.reps[i]) + '" oninput="setRep(\'' + k + "'," + i + ',this.value)">';
        h += "</div>";
      }
      if(!it.lite) h += '<textarea class="note" placeholder="Note / ressenti" oninput="setF(\'' + k + "','note',this.value)\">" + esc(d.note) + "</textarea>"

  } else {

      : '<button class="finish" onclick="finishSession(\'' + s.id + '\')">✓ Séance terminée</button>';
  }
  h += "</div></div>";

function toggleSess(id){

function setRep(k,i,v){ const d=get(k); d.reps=d.reps||[]; d.reps[i]=v; scheduleSave(); markDone(k); }
function setW(k,el){ const d=get(k); d.w=el.value; el.classList.remove("carry"); scheduleSave(); markDone(k); }
function setF(k,f,v){ get(k)[f]=v; scheduleSave(); markDone(k); }
function toggleUp(k){ const d=get(k); d.up=!d.up; scheduleSave(); render(); }
function markDone(k){
  const el = document.getElementById("ex_" + k.replace(/\|/g,"_"));
  if(!el) return;
  const d = DATA[k];
  const f = d && (d.score || (d.reps||[]).some(hasVal) || hasVal(d.w));
  el.classList.toggle("done", !!f);
}

    + "(power clean 150, split jerk 145, C&amp;J 155, power snatch 95, OHS 95, arraché 105). "
    + "Les 8 WOD sont tous différents (EMOM, for time, AMRAP, chipper, ladder…), certains courts et intenses, d'autres longs. "
    + "Les charges écrites dans un WOD sont la prescription : adapte-les si besoin et note-le.</div></div>"

    + '<div class="bt">Profils</div><div class="ex"><div class="presc">'
    + "Le bouton <b>👤</b> en haut change de profil. Chaque profil a ses propres données, séparées des tiennes : "
    + "un autre utilisateur ne peut pas modifier ta progression. Un nouveau profil démarre avec toutes les charges vides.</div></div>"

    + '<div class="bt">Onglet 🏋️ Charges</div><div class="ex"><div class="presc">'
    + "Tout ce que tu as soulevé depuis le Bloc 2, dont le Bloc 6 en tête. Rien n'est supprimé : reprends <b>une marche en dessous de la dernière ligne</b> après une coupure.</div></div>"

    + '<div class="bt">Onglet Poids de corps</div><div class="ex"><div class="presc">'
    + "13 séances hors rotation, à refaire autant que tu veux. Le bouton <b>🔄 Nouvel essai</b> archive la perf actuelle et repart sur des champs vides.</div></div>"

    + '<div class="bt">Échauffement</div><div class="ex"><div class="presc">'
    + "10 à 15 minutes avant chaque séance. Les jours CrossFit, ajoute 5 minutes de mobilité épaules et poignets avant de toucher la barre.</div></div>"
    + "</div></div>";
}

/* ---------- PROGRESSION ---------- */
function showProg(){
  const wods = [];
  SESS.forEach(s => s.blocks.forEach((b,bi) => { if(!b.wod) return; const it = b.items[0], d = DATA[K(s.id,bi,it.id)];
    wods.push("<tr><td>" + esc(s.day.replace("SEMAINE ","S")) + "</td><td>" + esc(it.name) + "</td><td class=\"d\">" + (d && d.score ? esc(d.score) : "—") + "</td></tr>"); }));

  const ser = {}, order = [];
  SESS.forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    if(!it.w || b.wod) return;
    const d = DATA[K(s.id,bi,it.id)];
    if(!d || !hasVal(d.w)) return;
    if(!ser[it.ex]){ ser[it.ex] = { name:it.name.replace(/^A[12] · /,""), v:[] }; order.push(it.ex); }
    ser[it.ex].v.push(String(d.w).trim());
  })));
  const wRows = order.map(ex => {
    const v = ser[ex].v, nums = v.map(num).filter(x => !isNaN(x));
    return "<tr><td>" + esc(ser[ex].name) + "</td><td>" + esc(v[0]) + "</td><td>" + esc(v[v.length-1]) + "</td><td class=\"d\">" + (nums.length ? Math.max.apply(null, nums) : "—") + "</td></tr>";
  }).join("");

  const ups = [], pdcScores = [];
  SESS.forEach(s => s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(d && d.up) ups.push(s.day.replace("SEMAINE ","S") + " · " + it.name);
  })));
  PDC.forEach(s => { const l = perfLine(s); if(l) pdcScores.push(esc(s.name) + " → " + esc(l)); });

  open_("📈 Progression",
    '<div class="prog"><div class="bt">Scores des WOD</div>'
    + "<table><tr><th>Séance</th><th>WOD</th><th>Score</th></tr>" + wods.join("") + "</table>"
    + '<div class="bt">Charges du bloc</div>'
    + (wRows ? "<table><tr><th>Exercice</th><th>1re</th><th>Dernière</th><th>Max</th></tr>" + wRows + "</table>" : '<div class="presc">Aucune charge notée pour l\'instant.</div>')
    + '<div class="bt">Marqués ↑ (peuvent monter)</div>'
    + (ups.length ? ups.map(x => '<span class="pill">' + esc(x) + "</span>").join("") : '<div class="presc">Rien pour l\'instant.</div>')
    + '<div class="bt">Poids de corps</div>'
    + (pdcScores.length ? pdcScores.map(x => '<div class="pill" style="display:block;margin-bottom:5px">' + x + "</div>").join("") : '<div class="presc">Aucune séance poids de corps notée.</div>')
    + "</div>");
}

/* ---------- EXPORT / RÉSUMÉ ---------- */
function doExport(){
  const blob = new Blob([JSON.stringify({ store:STORE, profil:PROFILE.name, bloc:PROGRAM.bloc, date:new Date().toISOString(), data:DATA }, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "bloc7-" + PROFILE.id + "-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function sessionResume(s){
  let stxt = "";
  s.blocks.forEach((b,bi) => b.items.forEach(it => {
    const d = DATA[K(s.id,bi,it.id)];
    if(!d) return;
    if(b.wod && it.sets){
      const r = (d.reps||[]).filter(hasVal);
      if(r.length) stxt += " • " + it.name + " → [" + r.join(",") + "] " + it.unit + "\n";
      return;
    }
    if(b.wod){
      if(!d.score) return;
      stxt += " • " + it.name + " → " + d.score + (d.up?" ↑":"") + "\n";
    } else {
      const r = (d.reps||[]).filter(hasVal);
      const w = hasVal(d.w) ? String(d.w).trim() : "";
      if(!r.length && !w && !d.note) return;
      stxt += " • " + it.name
        + (w ? " [" + w + " lb]" : "")
        + (r.length ? " → [" + r.join(",") + "] " + it.unit : "")
        + (d.rpe ? " RPE" + d.rpe : "") + (d.up?" ↑":"") + "\n";
    }
    if(d.note) stxt += "   Note : " + d.note + "\n";
  }));
  (meta().att[s.id]||[]).forEach(a => { stxt += " • [essai archivé " + a.date + "] " + a.txt + "\n"; });
  return stxt;
}

function buildResume(){
  let out = "=== MON BILAN — BLOC 7 (MUSCU LUN/MER/VEN + CROSSFIT MAR/JEU, 4 SEMAINES) ===\n"
    + (isOwner() ? "" : "Profil : " + PROFILE.name + "\n")
    + "Date : " + new Date().toLocaleDateString("fr-FR") + "\n"
    + "Séances salle terminées : " + SESS.filter(isDone).length + "/" + N + "\n";
  SESS.forEach(s => {
    const stxt = sessionResume(s);
    if(stxt || isDone(s))
      out += "\n── " + s.day + " — " + s.name + (isDone(s) ? " (fait le " + doneDate(s) + ")" : " (non terminée)") + " ──\n" + stxt;
  });

  let pdcOut = "";
  PDC.forEach(s => {
    const stxt = sessionResume(s);
    if(stxt || isDone(s))
      pdcOut += "\n── " + s.day + " — " + s.name + (isDone(s) ? " (fait le " + doneDate(s) + ")" : "") + " ──\n" + stxt;
  });
  if(pdcOut) out += "\n\n=== SÉANCES POIDS DE CORPS ===" + pdcOut;

  out += "\n=== DEMANDE ===\nVoici mon bilan Bloc 7. Analyse mes progressions et crée mon Bloc 8 (même format hebdomadaire fixe sur 4 semaines : muscu lundi/mercredi/vendredi, CrossFit mardi/jeudi avec technique, travail lourd et un WOD différent à chaque séance).\n";
  return out;
}
function showResume(){ open_("🤖 Résumé à coller dans Claude", '<textarea id="box" readonly>' + esc(buildResume()) + "</textarea>"); }
function open_(t, html){
  document.getElementById("mtitle").textContent = t;
  document.getElementById("mcontent").innerHTML = html;
  document.getElementById("modal").classList.add("on");
}
function closeModal(){ document.getElementById("modal").classList.remove("on"); }
function copyBox(){
  const b = document.getElementById("box");
  const txt = b ? b.value : document.getElementById("mcontent").innerText;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert("Copié ✓"), ()=>fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); alert("Copié ✓"); }catch(e){ alert("Copie manuelle nécessaire"); }
  document.body.removeChild(ta);
}

/* ---------- INIT ---------- */
function initData(){
  const list = loadProfiles();
  let cur = LS.get("prog_profile_cur");
  /* Appareil d'Oussama (données des blocs précédents présentes) : ouverture directe sur son profil */
  const ownerDevice = !!(LS.get(PROGRAM.store) || LS.get("prog_logs_v8") || LS.get("prog_logs_v7"));
  if(!cur && ownerDevice) cur = OWNER;
  if(cur === OWNER && !list.some(p => p.id === OWNER)){ list.unshift({ id:OWNER, name:OWNER_NAME }); saveProfiles(list); }
  if(cur && list.some(p => p.id === cur)){ useProfile(cur); return; }
  /* Appareil sans profil choisi : on demande qui s'entraîne */
  render();
  showPicker(false);
}

document.addEventListener("visibilitychange", () => { if(ready && !document.hidden && Date.now()-lastCloud > 30000) pullCloud(); });
window.addEventListener("pageshow", () => { if(ready && Date.now()-lastCloud > 30000) pullCloud(); });
window.addEventListener("beforeunload", saveLocal);
initData();
